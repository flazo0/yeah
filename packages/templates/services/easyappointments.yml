# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Easyappointments"
description: "Schedule Anything. Let's start with easy! Get the best free online appointment scheduler on your server, today."
icon: task_alt
logo: "easyappointments.png"
category: productivity
tags: ["calendar", "scheduling", "database"]
docs: "https://easyappointments.org/"
main: "easyappointments"
port: 80
env:
  SERVICE_URL_EASYAPPOINTMENTS: "http://localhost"
  SERVICE_PASSWORD_EASYAPPOINTMENTS: "$generate:password"
compose: |
  services:
    easyappointments:
      image: alextselegidis/easyappointments:latest
      environment:
        - BASE_URL=${SERVICE_URL_EASYAPPOINTMENTS}
        - DB_HOST=mysql
        - DB_NAME=easyappointments
        - DB_USERNAME=root
        - DB_PASSWORD=${SERVICE_PASSWORD_EASYAPPOINTMENTS}
      depends_on:
        - mysql
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1"]
        interval: 2s
        timeout: 10s
        retries: 30
    mysql:
      image: mysql:8
      volumes:
        - easyappointments-mysql-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_EASYAPPOINTMENTS}
        - MYSQL_DATABASE=easyappointments
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    easyappointments-mysql-data: {}
