# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Soketi App Manager"
description: "Manage soketi websocket server and apps with ease."
icon: code
logo: "soketi-app-manager.svg"
category: dev
tags: ["soketi", "websockets", "app-manager", "dashboard"]
docs: "https://github.com/rahulhaque/soketi-app-manager-filament"
main: "soketi-app-manager"
port: 8080
env:
  SERVICE_FQDN_SOKETIAPPMANAGER: "localhost"
  APP_KEY: ""
  DB_CONNECTION: ""
  DB_HOST: ""
  DB_PORT: ""
  DB_DATABASE: "soketi_app_manager"
  DB_USERNAME: ""
  DB_PASSWORD: ""
  PUSHER_HOST: ""
  PUSHER_PORT: ""
  PUSHER_SCHEME: ""
  PUSHER_APP_CLUSTER: ""
  SOKETI_DB_REDIS_USERNAME: ""
  SOKETI_DB_REDIS_PASSWORD: ""
  METRICS_HOST: ""
compose: |
  services:
    soketi-app-manager:
      image: ghcr.io/rahulhaque/soketi-app-manager-filament-alpine:latest
      environment:
        - AUTORUN_ENABLED=true
        - AUTORUN_LARAVEL_MIGRATION=${AUTORUN_LARAVEL_MIGRATION:-true}
        - APP_DEBUG=${APP_DEBUG:-false}
        - APP_URL=$SERVICE_FQDN_SOKETIAPPMANAGER
        - APP_KEY=$APP_KEY
        - DB_CONNECTION=$DB_CONNECTION
        - DB_HOST=$DB_HOST
        - DB_PORT=$DB_PORT
        - DB_DATABASE=$DB_DATABASE
        - DB_USERNAME=$DB_USERNAME
        - DB_PASSWORD=$DB_PASSWORD
        - PUSHER_HOST=$PUSHER_HOST
        - PUSHER_PORT=$PUSHER_PORT
        - PUSHER_SCHEME=$PUSHER_SCHEME
        - PUSHER_APP_CLUSTER=$PUSHER_APP_CLUSTER
        - SOKETI_DB_REDIS_USERNAME=$SOKETI_DB_REDIS_USERNAME
        - SOKETI_DB_REDIS_PASSWORD=$SOKETI_DB_REDIS_PASSWORD
        - METRICS_HOST=$METRICS_HOST
      healthcheck:
        test: ["CMD", "php-fpm-healthcheck"]
        start_period: 10s
