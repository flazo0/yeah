# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Gitea With Mariadb"
description: "Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting."
icon: code
logo: "gitea-with-mariadb.svg"
category: dev
tags: ["version control", "collaboration", "code", "hosting", "lightweight", "mariadb"]
docs: "https://docs.gitea.com"
notes: "Publica portas direto no servidor (`ports:`); confira conflitos com outros recursos."
main: "gitea"
port: 3000
env:
  MYSQL_DATABASE: ""
  SERVICE_USER_MYSQL: "$generate:user"
  SERVICE_PASSWORD_MYSQL: "$generate:password"
  SERVICE_PASSWORD_MYSQLROOT: "$generate:password"
compose: |
  services:
    gitea:
      image: gitea/gitea:latest
      environment:
        - USER_UID=1000
        - USER_GID=1000
        - GITEA__database__DB_TYPE=mysql
        - GITEA__database__HOST=mariadb
        - GITEA__database__NAME=${MYSQL_DATABASE-gitea}
        - GITEA__database__USER=$SERVICE_USER_MYSQL
        - GITEA__database__PASSWD=$SERVICE_PASSWORD_MYSQL
      volumes:
        - gitea-data:/data
        - gitea-timezone:/etc/timezone:ro
        - gitea-localtime:/etc/localtime:ro
      ports:
        - 22222:22
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
        interval: 2s
        timeout: 10s
        retries: 15

    mariadb:
      image: mariadb:11
      volumes:
        - gitea-mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_USER=${SERVICE_USER_MYSQL}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    gitea-data: {}
    gitea-timezone: {}
    gitea-localtime: {}
    gitea-mariadb-data: {}
