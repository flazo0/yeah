# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Karakeep"
description: "A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text search"
icon: task_alt
logo: "karakeep.svg"
category: productivity
tags: ["media", "read-it-later", "pocket-alternative", "omnivore-alternative", "instapaper-alternative"]
docs: "https://docs.karakeep.app/"
main: "web"
port: 3000
env:
  SERVICE_URL_KARAKEEP: "http://localhost"
  SERVICE_PASSWORD_KARAKEEPNEXTAUTH: "$generate:password"
  SERVICE_PASSWORD_MEILI: "$generate:password"
  SERVICE_OPENAI_API_KEY: ""
compose: |
  services:
    web:
      image: ghcr.io/karakeep-app/karakeep:0.33.2
      volumes:
        - karakeep-data:/data
      environment:
        - NEXTAUTH_URL=${SERVICE_URL_KARAKEEP}
        - NEXTAUTH_SECRET=${SERVICE_PASSWORD_KARAKEEPNEXTAUTH}
        - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
        - MEILI_ADDR=http://meilisearch:7700
        - BROWSER_WEB_URL=http://chrome:9222
        - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY}
        - DISABLE_SIGNUPS=${SERVICE_DISABLE_SIGNUPS:-false}
        - DATA_DIR=/data

    chrome:
      image: ghcr.io/karakeep-app/karakeep-chrome:release
      command:
        - '--no-sandbox'
        - '--disable-gpu'
        - '--disable-dev-shm-usage'
        - '--hide-scrollbars'
        - '--disable-blink-features=AutomationControlled'
        - '--window-size=1440,900'

    meilisearch:
      image: getmeili/meilisearch:v1.41.0
      environment:
        - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-true}
        - NEXTAUTH_SECRET=${SERVICE_PASSWORD_KARAKEEPNEXTAUTH}
        - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
        - NEXTAUTH_URL=${SERVICE_URL_KARAKEEP}
      volumes:
        - karakeep-meilisearch:/meili_data
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
        interval: 2s
        timeout: 10s
        retries: 15

  volumes:
    karakeep-data: {}
    karakeep-meilisearch: {}
