# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Martin"
description: "Martin is a tile server able to generate and serve vector tiles on the fly from large PostGIS databases, PMTiles (local or remote), and MBTiles files, allowing multiple tile sources to be dynamically combined into one."
icon: dns
logo: "martin.png"
category: backend
tags: ["postgis", "vector", "tiles"]
docs: "https://maplibre.org/martin/introduction.html/"
main: "martin"
port: 3000
env:
  SERVICE_URL_MARTIN: "http://localhost"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
compose: |
  services:
    martin:
      image: ghcr.io/maplibre/martin:v0.13.0
      environment:
        - HOST=${SERVICE_URL_MARTIN}
        - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-martin-db}
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
        interval: 5s
        timeout: 20s
        retries: 10

    postgresql:
      image: postgis/postgis:16-3.4-alpine
      platform: linux/amd64
      volumes:
        - martin-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-martin-db}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    martin-postgresql-data: {}
