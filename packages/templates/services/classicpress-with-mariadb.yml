name: "Classicpress With Mariadb"
description: "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
icon: language
logo: "classicpress-with-mariadb.svg"
category: cms
tags: ["cms", "blog", "content", "management"]
docs: "https://www.classicpress.net/"
main: "classicpress"
port: 80
env:
  SERVICE_USER_CLASSICPRESS: "$generate:user"
  SERVICE_PASSWORD_CLASSICPRESS: "$generate:password"
  SERVICE_PASSWORD_ROOT: "$generate:password"
compose: |
  services:
    classicpress:
      image: classicpress/classicpress:latest
      volumes:
        - classicpress-files:/var/www/html
      environment:
        - CLASSICPRESS_DB_HOST=mariadb
        - CLASSICPRESS_DB_USER=$SERVICE_USER_CLASSICPRESS
        - CLASSICPRESS_DB_PASSWORD=$SERVICE_PASSWORD_CLASSICPRESS
        - CLASSICPRESS_DB_NAME=classicpress
      depends_on:
        - mariadb
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1"]
        interval: 2s
        timeout: 10s
        retries: 10

    mariadb:
      image: mariadb:11
      volumes:
        - mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
        - MYSQL_DATABASE=classicpress
        - MYSQL_USER=$SERVICE_USER_CLASSICPRESS
        - MYSQL_PASSWORD=$SERVICE_PASSWORD_CLASSICPRESS
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    classicpress-files: {}
    mariadb-data: {}
