# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Termix"
description: "All-in-One SSH & Remote Desktop management app."
icon: code
category: dev
tags: ["ssh", "terminal", "remote-desktop", "rdp", "vnc", "server-management", "remote-access"]
docs: "https://docs.termix.site/install/server/docker"
main: "termix"
port: 8080
env: {}
compose: |
  services:
    termix:
      image: ghcr.io/lukegus/termix:2.6.1
      environment:
        - PORT=8080
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - GUACD_HOST=guacd
        - GUACD_RECORDING_PATH=/termix-data/session_recordings/guacamole
      depends_on:
        - guacd
      volumes:
        - termix-data:/app/data

    guacd:
      image: guacamole/guacd:1.6.0
