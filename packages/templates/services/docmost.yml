# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Docmost"
description: "Open-source collaborative wiki and documentation software"
icon: task_alt
logo: "docmost.png"
category: productivity
tags: ["documentation", "opensource", "wiki", "confluence", "knowledge-base", "notion", "realtime-collaboration", "notion-alternative"]
docs: "https://docmost.com/docs/"
main: "docmost"
port: 3000
env:
  SERVICE_BASE64_APPKEY: "$generate:base64"
  SERVICE_URL_DOCMOST_3000: "http://localhost"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  MAIL_DRIVER: ""
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_SECURE: ""
  MAIL_FROM_ADDRESS: ""
  MAIL_FROM_NAME: ""
  POSTMARK_TOKEN: ""
compose: |
  services:
    docmost:
      image: "docmost/docmost:latest"
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        - APP_SECRET=$SERVICE_BASE64_APPKEY
        - APP_URL=$SERVICE_URL_DOCMOST_3000
        - DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql/docmost?schema=public
        - REDIS_URL=redis://redis:6379
        - MAIL_DRIVER=${MAIL_DRIVER:?}
        - SMTP_HOST=${SMTP_HOST}
        - SMTP_PORT=${SMTP_PORT}
        - SMTP_USERNAME=${SMTP_USERNAME}
        - SMTP_PASSWORD=${SMTP_PASSWORD}
        - SMTP_SECURE=${SMTP_SECURE}
        - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
        - MAIL_FROM_NAME=${MAIL_FROM_NAME}
        - POSTMARK_TOKEN=${POSTMARK_TOKEN}
      volumes:
        - "docmost:/app/data/storage"
      healthcheck:
        test:
          - CMD
          - curl
          - "-f"
          - "http://127.0.0.1:3000"
        interval: 2s
        timeout: 10s
        retries: 20
    postgresql:
      image: "postgres:16-alpine"
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=docmost
      volumes:
        - "postgresql-data:/var/lib/postgresql/data"
      healthcheck:
        test:
          - CMD-SHELL
          - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        interval: 5s
        timeout: 10s
        retries: 20
    redis:
      image: "redis:7.2-alpine"
      volumes:
        - "redis-data:/data"
      healthcheck:
        test:
          - CMD
          - redis-cli
          - PING
        interval: 5s
        timeout: 10s
        retries: 20

  volumes:
    docmost: {}
    postgresql-data: {}
    redis-data: {}
