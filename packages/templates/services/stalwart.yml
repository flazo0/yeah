# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Stalwart"
description: "Modern mail server platform"
icon: forum
category: messaging
tags: ["mail", "smtp", "imap", "pop3", "jmap", "email", "sieve", "messaging"]
docs: "https://stalw.art/docs/"
notes: "Publica portas direto no servidor (`ports:`); confira conflitos com outros recursos."
main: "stalwart"
port: 8080
env: {}
compose: |
  services:
    stalwart:
      image: 'stalwartlabs/stalwart:v0.16.13'
      expose:
      - '8080'
      ports:
        - '25:25'
        - '465:465'
        - '587:587'
        - '993:993'
        - '995:995'
        - '143:143'
        - '110:110'
        - '4190:4190'
      volumes:
        - 'stalwart-mail:/etc/stalwart'
        - 'stalwart-data:/var/lib/stalwart'
        - '/etc/localtime:/etc/localtime:ro'
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/"]
        interval: 30s
        timeout: 10s
        retries: 3

  volumes:
    stalwart-mail: {}
    stalwart-data: {}
