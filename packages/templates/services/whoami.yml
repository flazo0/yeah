# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "Whoami"
description: "Tiny service that answers with the container name and the request headers — great for testing domains, the proxy and the network."
icon: badge
category: dev
website: "https://github.com/traefik/whoami"
main: whoami
port: 80
env: {}
compose: |
  services:
    whoami:
      image: traefik/whoami:latest
      restart: unless-stopped
