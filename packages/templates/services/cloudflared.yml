# Imported from the Coolify service template catalog (Apache-2.0) by scripts/import-coolify-templates.ts — see NOTICE.
name: "Cloudflared"
description: "Client for Cloudflare Tunnel, a daemon that exposes private services through the Cloudflare edge."
icon: terminal
logo: "cloudflared.svg"
category: devops
docs: "https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/"
notes: "Uses `network_mode: host`: the container shares the server's network."
main: "cloudflared"
port: 80
env:
  CLOUDFLARE_TUNNEL_TOKEN: ""
compose: |
  services:
    cloudflared:
      container_name: cloudflare-tunnel
      image: cloudflare/cloudflared:latest
      restart: unless-stopped
      network_mode: host
      command: tunnel --no-autoupdate run
      environment:
        - 'TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}'
      healthcheck:
        test: ["CMD", "cloudflared", "--version"]
        interval: 5s
        timeout: 20s
        retries: 10
