# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Docker Registry"
description: "The Docker Registry lets you distribute Docker images."
icon: code
logo: "docker-registry.png"
category: dev
tags: ["registry", "images", "docker"]
docs: "https://distribution.github.io/distribution/"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "registry"
port: 5000
env:
  SERVICE_USER_REGISTRY: "$generate:user"
  SERVICE_PASSWORD_REGISTRY: "$generate:password"
files:
  "etc/entrypoint.sh": "#!/usr/bin/env sh\nset -e \n\nif [ -z \"$USERNAME\" ] || [ -z \"$PASSWORD\" ]; then\n    echo \"Error: USERNAME and PASSWORD environment variables must be set\"\n    exit 1\nfi\n\napk add --no-cache apache2-utils\nmkdir -p \"$(dirname \"$REGISTRY_AUTH_HTPASSWD_PATH\")\"\nchmod 755 \"$(dirname \"$REGISTRY_AUTH_HTPASSWD_PATH\")\"\nhtpasswd -Bbc \"$REGISTRY_AUTH_HTPASSWD_PATH\" \"$USERNAME\" \"$PASSWORD\"\nregistry serve /etc/docker/registry/config.yml\n"
  "config/config.yml": "version: 0.1\nlog:\n  fields:\n    service: registry\nstorage:\n  cache:\n    blobdescriptor: inmemory\n  filesystem:\n    rootdirectory: /var/lib/registry\nhttp:\n  addr: :5000\n  headers:\n    X-Content-Type-Options: [nosniff]\nhealth:\n  storagedriver:\n    enabled: true\n    interval: 10s\n    threshold: 3"
compose: |
  services:
    registry:
      image: registry:3
      environment:
        - USERNAME=${SERVICE_USER_REGISTRY}
        - PASSWORD=${SERVICE_PASSWORD_REGISTRY}
        - REGISTRY_AUTH=htpasswd
        - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
        - REGISTRY_AUTH_HTPASSWD_PATH=/auth/registry.password
      command: ["/entrypoint.sh"]
      volumes:
        - registry-data:/var/lib/registry
        - ./etc/entrypoint.sh:/entrypoint.sh
        - ./config/config.yml:/etc/docker/registry/config.yml
      healthcheck:
        test:
          - CMD
          - wget
          - "-q"
          - "--spider"     
          - "http://localhost:5000/"  
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    registry-data: {}
