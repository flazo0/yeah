# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Firefox"
description: "Fast, private, and self-hosted secure browser for browsing without limits."
icon: task_alt
logo: "firefox.svg"
category: productivity
tags: ["browser", "web", "privacy"]
docs: "https://github.com/jlesage/docker-firefox"
main: "firefox"
port: 5800
env: {}
compose: |
  services:
    firefox:
      image: jlesage/firefox
      volumes:
        - firefox_config:/config
      healthcheck:
        test:
          - CMD
          - wget
          - "-q"
          - "--spider"
          - "http://127.0.0.1:5800/"
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    firefox_config: {}
