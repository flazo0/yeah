# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Duplicati"
description: "Duplicati is a backup solution, allowing you to make scheduled backups with encryption."
icon: folder
logo: "duplicati.webp"
category: storage
tags: ["backup", "encryption"]
docs: "https://duplicati.readthedocs.io"
main: "duplicati"
port: 8200
env:
  SERVICE_PASSWORD_ENCRYPT: "$generate:password"
  SERVICE_PASSWORD_WEB: "$generate:password"
compose: |
  services:
    duplicati:
      image: lscr.io/linuxserver/duplicati:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/London}
        - SETTINGS_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPT}
        - DUPLICATI__WEBSERVICE_PASSWORD=${SERVICE_PASSWORD_WEB}
      volumes:
        - duplicati-config:/config
        - duplicati-backups:/backups
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:8200"]
        interval: 2s
        timeout: 10s
        retries: 15
