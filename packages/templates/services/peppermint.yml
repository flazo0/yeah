# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Peppermint"
description: "Open source helpdesk solution designed to enhance the user experience for teams currently utilizing costly software alternatives"
icon: task_alt
logo: "peppermint.png"
category: productivity
tags: ["helpdesk", "open-source", "peppermint", "postgres"]
docs: "https://docs.peppermint.sh/"
main: "peppermint"
port: 3000
env:
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  SERVICE_PASSWORD_PEPPERMINT: "$generate:password"
  SERVICE_URL_PEPPERMINT_5003: "http://localhost"
compose: |
  services:
    postgres:
      image: postgres:16-alpine
      volumes:
        - peppermint-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${SERVICE_USER_POSTGRES}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-peppermint-db}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10

    peppermint:
      image: pepperlabs/peppermint:latest
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
        interval: 2s
        timeout: 10s
        retries: 15
      environment:
        - DB_USERNAME=${SERVICE_USER_POSTGRES}
        - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
        - DB_HOST=postgres
        - DB_NAME=${POSTGRES_DB:-peppermint-db}
        - SECRET=${SERVICE_PASSWORD_PEPPERMINT}
        - API_URL=${SERVICE_URL_PEPPERMINT_5003}
        # The default login is "admin@admin.com" with the password "1234"
