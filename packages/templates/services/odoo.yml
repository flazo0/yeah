# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Odoo"
description: "Odoo is a suite of open-source business apps that cover all your company needs."
icon: task_alt
logo: "odoo.svg"
category: productivity
tags: ["business", "apps", "CRM", "eCommerce", "accounting", "inventory", "point of sale", "project management"]
docs: "https://www.odoo.com/"
main: "odoo"
port: 8069
env:
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
compose: |
  services:
    odoo:
      image: odoo:18
      environment:
        - HOST=postgresql
        - USER=$SERVICE_USER_POSTGRES
        - PASSWORD=$SERVICE_PASSWORD_POSTGRES
      volumes:
        - odoo-web-data:/var/lib/odoo
        - odoo-extra-addons:/mnt/extra-addons
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:8069"]
        interval: 2s
        timeout: 10s
        retries: 30
    postgresql:
      image: postgres:16-alpine
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=postgres
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    odoo-web-data: {}
    odoo-extra-addons: {}
    postgresql-data: {}
