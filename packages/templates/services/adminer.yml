# Template de serviço do yeah. Campos: name, description, icon (Material Symbols), category, tags, main (serviço que recebe o domínio),
# port (porta desse serviço), env (valores iniciais; "$generate:password|hex|base64" gera um segredo novo a cada instância) e compose.
name: "Adminer"
description: "Cliente web leve pra PostgreSQL, MySQL e SQLite — conecte pelo nome interno dos bancos do ambiente."
icon: table_view
category: database
website: "https://www.adminer.org"
main: adminer
port: 8080
env: {}
compose: |
  services:
    adminer:
      image: adminer:latest
      restart: unless-stopped
