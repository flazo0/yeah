# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Libreoffice"
description: "LibreOffice is a free and powerful office suite."
icon: task_alt
logo: "libreoffice.svg"
category: productivity
tags: ["office", "document", "spreadsheet", "presentation", "open-source"]
docs: "https://docs.linuxserver.io/images/docker-libreoffice/"
main: "libreoffice"
port: 3000
env: {}
compose: |
  services:
    libreoffice:
      image: lscr.io/linuxserver/libreoffice:latest
      environment:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
        - TZ=${TZ:-Etc/UTC}
      volumes:
        - libreoffice-config:/config
      healthcheck:
        test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
        interval: 30s
        timeout: 10s
        retries: 3
