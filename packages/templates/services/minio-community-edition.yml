# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Minio Community Edition"
description: "MinIO is a high performance object storage server compatible with Amazon S3 APIs."
icon: folder
logo: "minio-community-edition.svg"
category: storage
tags: ["object", "storage", "server", "s3", "api"]
docs: "https://silo.pigsty.io/docs/"
main: "minio"
port: 80
env:
  MINIO_SERVER_URL: ""
  MINIO_BROWSER_REDIRECT_URL: ""
  SERVICE_USER_MINIO: "$generate:user"
  SERVICE_PASSWORD_MINIO: "$generate:password"
compose: |
  services:
    minio:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z # Released on 15 October 2026
      command: server /data --console-address ":9001"
      environment:
        - MINIO_SERVER_URL=$MINIO_SERVER_URL
        - MINIO_BROWSER_REDIRECT_URL=$MINIO_BROWSER_REDIRECT_URL
        - MINIO_ROOT_USER=$SERVICE_USER_MINIO
        - MINIO_ROOT_PASSWORD=$SERVICE_PASSWORD_MINIO
      volumes:
        - minio-data:/data
      healthcheck:
        test: ["CMD", "mc", "ready", "local"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    minio-data: {}
