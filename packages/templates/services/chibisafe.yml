# Imported from the Coolify service template catalog (Apache-2.0) by scripts/import-coolify-templates.ts — see NOTICE.
name: "Chibisafe"
description: "A beautiful and performant vault to save all your files in the cloud."
icon: folder
logo: "chibisafe.svg"
category: storage
tags: ["storage", "file-sharing", "upload", "sharing"]
docs: "https://chibisafe.app/docs/intro"
notes: "This template ships its own configuration files; they were converted from the Coolify format and have not been validated on a real installation yet."
main: "chibisafe"
port: 80
env: {}
files:
  "Caddyfile": "# chibisafe/Caddyfile\n# https://chibisafe.moe/guides/running-with-docker\n:80 {\n  route {\n    file_server * {\n        root /app/uploads\n        pass_thru\n    }\n    @api path /api/*\n    reverse_proxy @api http://chibisafe-server:8000 {\n        header_up Host {http.reverse_proxy.upstream.hostport}\n        header_up X-Real-IP {http.request.header.X-Real-IP}\n    }\n    @docs path /docs*\n    reverse_proxy @docs http://chibisafe-server:8000 {\n        header_up Host {http.reverse_proxy.upstream.hostport}\n        header_up X-Real-IP {http.request.header.X-Real-IP}\n    }\n    reverse_proxy http://chibisafe:8001 {\n        header_up Host {http.reverse_proxy.upstream.hostport}\n        header_up X-Real-IP {http.request.header.X-Real-IP}\n    }\n  }\n}\n"
compose: |
  services:
    chibisafe:
      image: chibisafe/chibisafe:v6.5.5
      environment:
        - BASE_API_URL=http://chibisafe-server:8000
      healthcheck:
        test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8001"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s

    chibisafe-server:
      image: chibisafe/chibisafe-server:v6.5.5
      volumes:
        - chibisafe-database:/app/database:rw
        - chibisafe-uploads:/app/uploads:rw
        - chibisafe-logs:/app/logs:rw
      healthcheck:
        test:
          [
            "CMD",
            "wget",
            "--spider",
            "--quiet",
            "http://127.0.0.1:8000/api/health",
          ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s

    caddy:
      image: caddy:2-alpine
      healthcheck:
        test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:80"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
      volumes:
        - chibisafe-uploads:/app/uploads:ro
        - ./Caddyfile:/etc/caddy/Caddyfile

  volumes:
    chibisafe-database: {}
    chibisafe-uploads: {}
    chibisafe-logs: {}
