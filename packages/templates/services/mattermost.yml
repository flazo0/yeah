# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Mattermost"
description: "Mattermost is an open source, self-hosted Slack-alternative."
icon: forum
logo: "mattermost.svg"
category: messaging
tags: ["mattermost", "slack", "alternative"]
docs: "https://docs.mattermost.com"
main: "mattermost"
port: 8065
env:
  SERVICE_URL_MATTERMOST: "http://localhost"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  POSTGRES_DB: "mattermost"
compose: |
  services:
    mattermost:
      image: mattermost/mattermost-team-edition:release-10
      platform: linux/amd64
      volumes:
        - "mattermost-data-config:/mattermost/config:rw"
        - "mattermost-data-data:/mattermost/data:rw"
        - "mattermost-data-logs:/mattermost/logs:rw"
        - "mattermost-data-plugins:/mattermost/plugins:rw"
        - "mattermost-data-client-plugins:/mattermost/client/plugins:rw"
        - "mattermost-data-bleve-indexes:/mattermost/bleve-indexes:rw"
      environment:
        - MM_SERVICESETTINGS_SITEURL=${SERVICE_URL_MATTERMOST}
        - TZ=${TZ:-UTC}
        - MM_SQLSETTINGS_DRIVERNAME=postgres
        - MM_SQLSETTINGS_DATASOURCE=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/$POSTGRES_DB?sslmode=disable&connect_timeout=10
        - MM_BLEVESETTINGS_INDEXDIR=/mattermost/bleve-indexes
      depends_on:
        postgres:
          condition: service_healthy

    postgres:
      image: postgres:16-alpine
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-mattermost}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    mattermost-data-config: {}
    mattermost-data-data: {}
    mattermost-data-logs: {}
    mattermost-data-plugins: {}
    mattermost-data-client-plugins: {}
    mattermost-data-bleve-indexes: {}
    postgresql-data: {}
