# Imported from the Coolify service template catalog (Apache-2.0) by scripts/import-coolify-templates.ts — see NOTICE.
name: "Terraria Server"
description: "Docker multi-arch Image for Terraria Server."
icon: sports_esports
logo: "terraria-server.svg"
category: games
tags: ["terraria"]
docs: "https://github.com/hexlo/terraria-server-docker"
notes: "Publishes ports directly on the server (`ports:`); check for conflicts with other resources."
main: "terraria-server"
port: 7777
env:
  SERVICE_PASSWORD_TERRARIA: "$generate:password"
compose: |
  services:
    terraria-server:
      image: hexlo/terraria-server-docker:1.4.5.0
      stdin_open: true
      tty: true
      ports:
        - 7777:7777
      volumes:
        - terraria-server:/root/.local/share/Terraria/Worlds
      environment:
        - worldpath=${WORLDPATH:-/root/.local/share/Terraria/Worlds}
        - autocreate=${AUTOCREATE:-2}
        - world=${WORLD:-world1.wld}
        - difficulty=${DIFFICULTY:-1}
        - maxplayers=${MAXPLAYERS:-8}
        - password=${SERVICE_PASSWORD_TERRARIA}
        - motd=${MOTD:-Welcome to the server!}
        - language=${LANGUAGE:-en/US}
        - secure=${SECURE:-1}

  volumes:
    terraria-server: {}
