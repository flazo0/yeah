# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Firefly"
description: "A personal finances manager that can help you save money."
icon: payments
logo: "firefly.svg"
category: finance
tags: ["finance", "money", "personal", "manager"]
docs: "https://firefly-iii.org"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "firefly"
port: 8080
env:
  SERVICE_BASE64_APPKEY: "$generate:base64"
  SERVICE_USER_MYSQL: "$generate:user"
  SERVICE_PASSWORD_MYSQL: "$generate:password"
  SERVICE_BASE64_CRONTOKEN: "$generate:base64"
  SERVICE_PASSWORD_MYSQLROOT: "$generate:password"
  STATIC_CRON_TOKEN: ""
files:
  "entrypoint.sh": "#!/bin/sh\n# Substitute the environment variable into the cron command\nCRON_COMMAND=\"0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/${STATIC_CRON_TOKEN}\"\n# Add the cron command to the crontab\necho \"$CRON_COMMAND\" | crontab -\n# Start the cron daemon in the foreground with logging to stdout\ncrond -f -L /dev/stdout\n"
compose: |
  services:
    firefly:
      image: fireflyiii/core:latest
      environment:
        - APP_KEY=$SERVICE_BASE64_APPKEY
        - DB_HOST=mysql
        - DB_PORT=3306
        - DB_CONNECTION=mysql
        - DB_DATABASE=${MYSQL_DATABASE:-firefly}
        - DB_USERNAME=$SERVICE_USER_MYSQL
        - DB_PASSWORD=$SERVICE_PASSWORD_MYSQL
        - STATIC_CRON_TOKEN=$SERVICE_BASE64_CRONTOKEN
        - TRUSTED_PROXIES=*
      volumes:
        - firefly-upload:/var/www/html/storage/upload
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        mysql:
          condition: service_healthy
    mysql:
      image: mariadb:11
      environment:
        - MYSQL_USER=${SERVICE_USER_MYSQL}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-firefly}
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
      healthcheck:
        test:
          [
            "CMD",
            "mariadb-admin",
            "ping",
            "-h",
            "127.0.0.1",
            "-uroot",
            "-p${SERVICE_PASSWORD_MYSQLROOT}",
          ]
        interval: 5s
        timeout: 20s
        retries: 10
      volumes:
        - firefly-mysql-data:/var/lib/mysql
    cron:
      image: alpine
      entrypoint: ["/entrypoint.sh"]
      volumes:
        - ./entrypoint.sh:/entrypoint.sh
      environment:
        - STATIC_CRON_TOKEN=$SERVICE_BASE64_CRONTOKEN
      healthcheck:
        test: ["CMD-SHELL", "ls /entrypoint.sh || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

  volumes:
    firefly-upload: {}
    firefly-mysql-data: {}
