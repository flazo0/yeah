# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Triliumnext"
description: "Build your personal knowledge base with TriliumNext Notes."
icon: task_alt
logo: "triliumnext.svg"
category: productivity
tags: ["self-hosted", "notes", "todo", "organize", "markdown", "wiki"]
docs: "https://github.com/TriliumNext/Trilium"
main: "triliumnext"
port: 8080
env: {}
compose: |
  services:
    triliumnext:
      image: ghcr.io/triliumnext/trilium:stable
      platform: linux/amd64 # https://github.com/TriliumNext/Trilium/issues/6390
      environment:
        - TZ=${TZ:-Europe/Berlin}
      volumes:
        - triliumnext_data:/home/node/trilium-data
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "wget --quiet --tries=1 --spider http://127.0.0.1:8080/api/health-check || exit 1",
          ]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    triliumnext_data: {}
