# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Triliumnext"
description: "Build your personal knowledge base with TriliumNext Notes."
icon: task_alt
logo: "triliumnext.svg"
category: productivity
tags: ["self-hosted", "notes", "todo", "organize", "markdown", "wiki"]
docs: "https://github.com/TriliumNext/Trilium"
main: "triliumnext"
port: 8080
env: {}
compose: |
  services:
    triliumnext:
      image: ghcr.io/triliumnext/trilium:stable
      environment:
        - TZ=${TZ:-Europe/Berlin}
      volumes:
        - triliumnext_data:/home/node/trilium-data
      healthcheck:
        test: ["CMD", "node", "/usr/src/app/docker_healthcheck.cjs"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    triliumnext_data: {}
