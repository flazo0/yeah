# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Transmission"
description: "Fast, easy, and free BitTorrent client."
icon: movie
logo: "transmission.svg"
category: media
tags: ["bittorrent", "torrent", "peer-to-peer"]
docs: "https://docs.linuxserver.io/images/docker-transmission/"
main: "transmission"
port: 9091
env:
  SERVICE_USER_ADMIN: "$generate:user"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
compose: |
  services:
    transmission:
      image: lscr.io/linuxserver/transmission:latest
      environment:
        - PUID=1000
        - PGID=1000
        - USER=${SERVICE_USER_ADMIN}
        - PASS=${SERVICE_PASSWORD_ADMIN}
      volumes:
        - transmission-config:/config
        - transmission-downloads:/downloads
        - transmission-watch:/watch
      healthcheck:
        test: [
          "CMD",
          "curl",
          "-sSfL",
          "-u",
          "${SERVICE_USER_ADMIN}:${SERVICE_PASSWORD_ADMIN}",
          "http://localhost:9091/"
        ]
        interval: 30s
        timeout: 10s
        retries: 3
