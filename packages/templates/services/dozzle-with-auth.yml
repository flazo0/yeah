# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Dozzle With Auth"
description: "Dozzle is a simple and lightweight web UI for Docker logs."
icon: code
logo: "dozzle-with-auth.svg"
category: dev
tags: ["dozzle", "docker", "logs", "web-ui"]
docs: "https://dozzle.dev/"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "dozzle"
port: 8080
env: {}
files:
  "data/users.yml": "users:\n  # \"admin\" is the username\n  admin:\n    email: test@email.com\n    name: Admin\n    # A bcrypt hash of the password you want to use. Can be computed with \"python3 -c 'import bcrypt;print(bcrypt.hashpw(b\"your-password\",bcrypt.gensalt(11)).decode())' \". Default password is \"test\".\n    password: $2a$11$viucCvFLlHWvBNOOI6uypuVU.D09UWb.zswRxEg0MkDPi1q/bKbdG\n"
compose: |
  services:
    dozzle:
      image: amir20/dozzle:latest
      environment:
        - DOZZLE_AUTH_PROVIDER=simple
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ./data/users.yml:/data/users.yml

      healthcheck:
        test: ["CMD", "/dozzle", "healthcheck"]
        interval: 3s
        timeout: 30s
        retries: 5
