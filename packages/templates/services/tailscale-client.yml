# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Tailscale Client"
description: "Tailscale securely connects your devices over the internet using WireGuard."
icon: terminal
logo: "tailscale-client.svg"
category: devops
tags: ["vpn", "wireguard", "remote-access"]
docs: "https://tailscale.com/kb"
main: "tailscale-client"
port: 80
env:
  TS_AUTHKEY: ""
compose: |
  services:
    tailscale-client:
      image: 'tailscale/tailscale:latest'
      hostname: '${TS_HOSTNAME:-coolify-ts}'
      environment:
        - 'TS_HOSTNAME=${TS_HOSTNAME:-coolify-ts}'
        - 'TS_AUTHKEY=${TS_AUTHKEY:?}'
        - 'TS_STATE_DIR=${TS_STATE_DIR:-/var/lib/tailscale}'
        - 'TS_USERSPACE=${TS_USERSPACE:-false}'
      volumes:
        - 'tailscale-client:/var/lib/tailscale'
      devices:
        - '/dev/net/tun:/dev/net/tun'
      cap_add:
        - net_admin
      healthcheck:
        test: ["CMD-SHELL", "tailscale status --json | grep -q 'BackendState'"]
        interval: 10s
        timeout: 5s
        retries: 5

    nginx:
      image: nginx:latest
      depends_on:
        - tailscale-client
      network_mode: 'service:tailscale-client'
      healthcheck:
        test:
          - CMD
          - curl
          - '-f'
          - 'http://localhost:80/'
          - '-o'
          - /dev/null
        interval: 20s
        timeout: 5s
        retries: 3
