# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Openobserve"
description: "Cloud-native observability platform for logs, metrics, traces, RUM, errors and session replays — a 140x cheaper alternative to Elasticsearch, Splunk and Datadog."
icon: monitor_heart
logo: "openobserve.svg"
category: monitoring
tags: ["logs", "metrics", "traces", "observability", "monitoring", "opentelemetry", "otel", "elasticsearch"]
docs: "https://openobserve.ai/docs/"
main: "openobserve"
port: 5080
env:
  SERVICE_PASSWORD_OPENOBSERVE: "$generate:password"
compose: |
  services:
    openobserve:
      image: public.ecr.aws/zinclabs/openobserve:v0.90.0
      environment:
        - ZO_DATA_DIR=/data
        - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
        - ZO_ROOT_USER_PASSWORD=${SERVICE_PASSWORD_OPENOBSERVE}
        - ZO_TELEMETRY=${ZO_TELEMETRY:-false}
        - ZO_COOKIE_SECURE_ONLY=${ZO_COOKIE_SECURE_ONLY:-true}
      volumes:
        - openobserve-data:/data
      healthcheck:
        test: ["CMD", "/openobserve", "node", "status"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 60s
