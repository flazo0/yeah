# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Plex"
description: "Plex organizes video, music and photos from personal media libraries and streams them to smart TVs, streaming boxes and mobile devices."
icon: movie
logo: "plex.svg"
category: media
tags: ["media", "server", "movies", "tv", "music"]
docs: "https://docs.linuxserver.io/images/docker-plex/"
main: "plex"
port: 32400
env:
  SERVICE_URL_PLEX: "http://localhost"
  PLEX_CLAIM: ""
compose: |
  services:
    plex:
      image: lscr.io/linuxserver/plex:latest
      environment:
        - _APP_URL=$SERVICE_URL_PLEX
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-America/Toronto}
        - PLEX_CLAIM=${PLEX_CLAIM}
      #devices:
      #  - "/dev/dri:/dev/dri"
      volumes:
        - plex-config:/config
        - plex-tv:/tv
        - plex-movies:/movies
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
        interval: 2s
        timeout: 10s
        retries: 15

  volumes:
    plex-config: {}
    plex-tv: {}
    plex-movies: {}
