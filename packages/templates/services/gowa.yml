# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Gowa"
description: "Golang WhatsApp - Built with Go for efficient memory use"
icon: forum
logo: "gowa.svg"
category: messaging
tags: ["whatsapp", "golang", "multidevice", "api", "go-whatsapp"]
docs: "https://github.com/aldinokemal/go-whatsapp-web-multidevice"
main: "gowa"
port: 3000
env:
  SERVICE_USER_GOWA: "$generate:user"
  SERVICE_PASSWORD_GOWA: "$generate:password"
  WHATSAPP_WEBHOOK: ""
  WHATSAPP_WEBHOOK_SECRET: ""
compose: |
  services:
    gowa:
      image: aldinokemal2104/go-whatsapp-web-multidevice:latest
      environment:
        - SERVICE_USER_GOWA
        - SERVICE_PASSWORD_GOWA
        - APP_BASIC_AUTH=${SERVICE_USER_GOWA}:${SERVICE_PASSWORD_GOWA}
        - APP_PORT=3000
        - APP_DEBUG=${APP_DEBUG:-false}
        - APP_ACCOUNT_VALIDATION=${APP_ACCOUNT_VALIDATION:-false}
        - WHATSAPP_WEBHOOK=${WHATSAPP_WEBHOOK}
        - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      volumes:
        - gowa_data:/app/storages
