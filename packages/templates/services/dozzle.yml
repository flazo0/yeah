# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "Dozzle"
description: "Real-time container log viewer."
icon: receipt_long
category: devops
website: "https://dozzle.dev"
notes: "Mounts the server's docker.sock (read-only)."
main: dozzle
port: 8080
env: {}
compose: |
  services:
    dozzle:
      image: amir20/dozzle:latest
      restart: unless-stopped
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
