# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Freshrss With Postgresql"
description: "A free, self-hostable feed aggregator."
icon: movie
logo: "freshrss-with-postgresql.png"
category: media
tags: ["rss", "feed"]
docs: "https://freshrss.org/index.html"
main: "freshrss"
port: 80
env:
  SERVICE_USER_POSTGRESQL: "$generate:user"
  SERVICE_PASSWORD_POSTGRESQL: "$generate:password"
compose: |
  services:
    freshrss:
      image: freshrss/freshrss:latest
      environment:
        - CRON_MIN=${CRON_MIN:-1,31}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-freshrss}
        - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
        - POSTGRES_HOST=freshrss-db
      volumes:
        - freshrss-data:/var/www/FreshRSS/data
        - freshrss-extensions:/var/www/FreshRSS/extensions
      depends_on:
        freshrss-db:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3

    freshrss-db:
      image: postgres:16
      volumes:
        - freshrss-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-freshrss}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
