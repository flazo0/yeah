# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Imgcompress"
description: "Offline image compression, conversion, and AI background removal for Docker homelabs."
icon: movie
logo: "imgcompress.png"
category: media
tags: ["compress", "photo", "server", "metadata"]
docs: "https://imgcompress.karimzouine.com"
main: "imgcompress"
port: 5000
env: {}
compose: |
  services:
    imgcompress:
      image: karimz1/imgcompress:0.6.0
      environment:
        - DISABLE_LOGO=${DISABLE_LOGO:-false}
        - DISABLE_STORAGE_MANAGEMENT=${DISABLE_STORAGE_MANAGEMENT:-false}
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:5000"]
        interval: 30s
        timeout: 10s
        retries: 3
