# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "pgAdmin"
description: "Web administration for PostgreSQL."
icon: database
category: database
website: "https://www.pgadmin.org"
main: pgadmin
port: 80
env:
  PGADMIN_DEFAULT_EMAIL: "admin@example.com"
  PGADMIN_DEFAULT_PASSWORD: "$generate:password"
compose: |
  services:
    pgadmin:
      image: dpage/pgadmin4:latest
      restart: unless-stopped
      environment:
        - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
        - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      volumes:
        - data:/var/lib/pgadmin
  volumes:
    data: {}
