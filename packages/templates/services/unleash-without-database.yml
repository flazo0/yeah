# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Unleash Without Database"
description: "Open source feature flag management for enterprises."
icon: code
logo: "unleash-without-database.svg"
category: dev
tags: ["unleash", "feature flags", "feature toggles", "ab testing", "open source"]
docs: "https://docs.getunleash.io"
main: "unleash"
port: 4242
env:
  SERVICE_URL_UNLEASH: "http://localhost"
  SERVICE_PASSWORD_UNLEASH: "$generate:password"
  DATABASE_URL: ""
compose: |
  services:
    unleash:
      image: 'unleashorg/unleash-server:latest'
      environment:
        - UNLEASH_URL=${SERVICE_URL_UNLEASH}
        - UNLEASH_DEFAULT_ADMIN_PASSWORD=${SERVICE_PASSWORD_UNLEASH}
        - DATABASE_URL=${DATABASE_URL}
        - DATABASE_SSL=${DATABASE_SSL:-false}
        - LOG_LEVEL=warn
        - INIT_FRONTEND_API_TOKENS=default:default:development.unleash-insecure-frontend-api-token
        - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token
      command:
        - node
        - index.js
      healthcheck:
        test: 'wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit 1'
        interval: 1s
        timeout: 1m
        retries: 5
        start_period: 15s
