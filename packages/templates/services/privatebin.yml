# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Privatebin"
description: "PrivateBin is a minimalist, open source online pastebin where the server has zero knowledge of pasted data."
icon: shield
logo: "privatebin.svg"
category: security
tags: ["text", "sharing"]
docs: "https://github.com/PrivateBin/PrivateBin/blob/master/doc/README.md"
main: "privatebin"
port: 8080
env: {}
compose: |
  services:
    privatebin:
      image: privatebin/nginx-fpm-alpine
      environment:
      volumes:
        - privatebin_data:/srv/data
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/"]
        interval: 5s
        timeout: 20s
        retries: 10
