# Imported from the Coolify service template catalog (Apache-2.0) by scripts/import-coolify-templates.ts — see NOTICE.
name: "Deno KV"
description: "The Denoland key-value database"
icon: database
logo: "deno-kv.svg"
category: database
tags: ["deno", "kv", "key-value", "database"]
docs: "https://docs.deno.com/deploy/kv/manual/"
main: "denokv"
port: 4512
env:
  SERVICE_PASSWORD_DENOKV: "$generate:password"
compose: |
  services:
    denokv:
      image: ghcr.io/denoland/denokv:latest
      environment:
        - 'ACCESS_TOKEN=${SERVICE_PASSWORD_DENOKV}'
      volumes:
        - 'deno-kv-data:/data'
      command: '--sqlite-path /data/denokv.sqlite serve --access-token ${SERVICE_PASSWORD_DENOKV}'
      healthcheck:
        test:
          - CMD
          - nc
          - '-zv'
          - 127.0.0.1
          - '4512'
        interval: 5s
        timeout: 5s
        retries: 3

  volumes:
    deno-kv-data: {}
