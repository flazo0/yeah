# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Vikunja"
description: "The open-source, self-hostable to-do app. Organize everything, on all platforms."
icon: task_alt
logo: "vikunja.svg"
category: productivity
tags: ["productivity", "todo"]
docs: "https://vikunja.io"
main: "vikunja"
port: 3456
env:
  SERVICE_URL_VIKUNJA: "http://localhost"
  SERVICE_PASSWORD_JWTSECRET: "$generate:password"
compose: |
  services:
    vikunja:
      image: vikunja/vikunja
      environment:
        - VIKUNJA_SERVICE_PUBLICURL=$SERVICE_URL_VIKUNJA
        - VIKUNJA_SERVICE_JWTSECRET=$SERVICE_PASSWORD_JWTSECRET
        - VIKUNJA_SERVICE_ENABLEREGISTRATION=true
        - VIKUNJA_DATABASE_PATH=/db/vikunja.db
        - VIKUNJA_DATABASE_TYPE=sqlite
      volumes:
        - vikunja-data:/app/vikunja/
        - vikunja-sqlite-data:/db
      depends_on:
        - init
    init:
      image: busybox
      restart: no
      volumes:
        - vikunja-sqlite-data:/db
      command: ["sh", "-c", "touch /db/vikunja.db && chown -R 1000 /db"]
