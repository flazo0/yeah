# Template de serviço do yeah. Campos: name, description, icon (Material Symbols), category, tags, main (serviço que recebe o domínio),
# port (porta desse serviço), env (valores iniciais; "$generate:password|hex|base64" gera um segredo novo a cada instância) e compose.
name: "WordPress"
description: "WordPress com MariaDB — o site e o banco sobem juntos."
icon: language
category: cms
website: "https://wordpress.org"
docs: "https://developer.wordpress.org/"
main: wordpress
port: 80
env:
  DB_PASSWORD: "$generate:password"
  DB_ROOT_PASSWORD: "$generate:password"
compose: |
  services:
    wordpress:
      image: wordpress:latest
      restart: unless-stopped
      depends_on:
        - db
      environment:
        - WORDPRESS_DB_HOST=db
        - WORDPRESS_DB_USER=wordpress
        - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
        - WORDPRESS_DB_NAME=wordpress
      volumes:
        - wp:/var/www/html
    db:
      image: mariadb:11
      restart: unless-stopped
      environment:
        - MARIADB_DATABASE=wordpress
        - MARIADB_USER=wordpress
        - MARIADB_PASSWORD=${DB_PASSWORD}
        - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      volumes:
        - db:/var/lib/mysql
  volumes:
    wp: {}
    db: {}
