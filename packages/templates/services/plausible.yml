# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Plausible"
description: "\"Plausible Analytics is a simple, open-source, lightweight (< 1 KB) and privacy-friendly web analytics alternative to Google Analytics.\""
icon: analytics
category: analytics
tags: ["analytics", "privacy", "google", "alternative"]
docs: "https://plausible.io/docs/self-hosting"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "plausible"
port: 8000
env:
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  SERVICE_URL_PLAUSIBLE: "http://localhost"
  SERVICE_BASE64_64_PLAUSIBLE: "$generate:base64long"
  SERVICE_REALBASE64_32_TOTP: "$generate:realbase64"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  MAILER_EMAIL: ""
  MAILER_NAME: ""
  SMTP_HOST_ADDR: ""
  SMTP_HOST_PORT: ""
  SMTP_USER_NAME: ""
  SMTP_USER_PWD: ""
  SMTP_HOST_SSL_ENABLED: ""
files:
  "clickhouse/clickhouse-config.xml": "<clickhouse><logger><level>warning</level><console>true</console></logger><query_log replace=\"1\"><database>system</database><table>query_log</table><engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day SETTINGS ttl_only_drop_parts=1</engine><flush_interval_milliseconds>7500</flush_interval_milliseconds></query_log><query_thread_log remove=\"remove\"/><text_log remove=\"remove\"/><trace_log remove=\"remove\"/><metric_log remove=\"remove\"/><asynchronous_metric_log remove=\"remove\"/><session_log remove=\"remove\"/><part_log remove=\"remove\"/></clickhouse>"
  "clickhouse/clickhouse-ipv4-only.xml": "<clickhouse><listen_host>0.0.0.0</listen_host></clickhouse>"
  "clickhouse/clickhouse-low-resources.xml": "<clickhouse><mark_cache_size>524288000</mark_cache_size></clickhouse>"
  "clickhouse/clickhouse-user-config.xml": "<clickhouse><profiles><default><max_threads>1</max_threads><max_block_size>8192</max_block_size><max_download_threads>1</max_download_threads><input_format_parallel_parsing>0</input_format_parallel_parsing><output_format_parallel_formatting>0</output_format_parallel_formatting></default></profiles></clickhouse>"
compose: |
  services:
    plausible:
      image: "ghcr.io/plausible/community-edition:v3.2.1"
      command: 'sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"'
      environment:
        - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@plausible-db:5432/${POSTGRES_DB:-plausible-db}
        - CLICKHOUSE_DATABASE_URL=http://plausible-events-db:8123/plausible_events_db
        - BASE_URL=${SERVICE_URL_PLAUSIBLE}
        - SECRET_KEY_BASE=${SERVICE_BASE64_64_PLAUSIBLE}
        - TOTP_VAULT_KEY=${SERVICE_REALBASE64_32_TOTP}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
        - MAILER_ADAPTER=${MAILER_ADAPTER:-Bamboo.LocalAdapter}
        - MAILER_EMAIL=${MAILER_EMAIL}
        - MAILER_NAME=${MAILER_NAME}
        - SMTP_HOST_ADDR=${SMTP_HOST_ADDR}
        - SMTP_HOST_PORT=${SMTP_HOST_PORT}
        - SMTP_USER_NAME=${SMTP_USER_NAME}
        - SMTP_USER_PWD=${SMTP_USER_PWD}
        - SMTP_HOST_SSL_ENABLED=${SMTP_HOST_SSL_ENABLED}
      depends_on:
        plausible-db:
          condition: service_healthy
        plausible-events-db:
          condition: service_healthy
      healthcheck:
        test:
          [
            "CMD",
            "wget",
            "--no-verbose",
            "--tries=1",
            "--spider",
            "http://127.0.0.1:8000/api/health",
          ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 45s

    plausible-db:
      image: "postgres:16-alpine"
      volumes:
        - plausible-postgres-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-plausible-db}
        - POSTGRES_USER=${SERVICE_USER_POSTGRES}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10

    plausible-events-db:
      image: "clickhouse/clickhouse-server:24.12-alpine"
      environment:
        - CLICKHOUSE_SKIP_USER_SETUP=1
      volumes:
        - plausible-events-data:/var/lib/clickhouse
        - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logs.xml:ro
        - ./clickhouse/clickhouse-ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
        - ./clickhouse/clickhouse-low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
        - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
          ]
        start_period: 30s

  volumes:
    plausible-postgres-data: {}
    plausible-events-data: {}
