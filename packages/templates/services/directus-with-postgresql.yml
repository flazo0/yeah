# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Directus With Postgresql"
description: "Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content."
icon: language
logo: "directus-with-postgresql.svg"
category: cms
tags: ["directus", "cms", "database", "sql"]
docs: "https://directus.io"
main: "directus"
port: 8055
env:
  SERVICE_BASE64_64_KEY: "$generate:base64long"
  SERVICE_BASE64_64_SECRET: "$generate:base64long"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
  SERVICE_USER_POSTGRESQL: "$generate:user"
  SERVICE_PASSWORD_POSTGRESQL: "$generate:password"
  CORS_ORIGIN: ""
compose: |
  services:
    directus:
      image: directus/directus:11
      volumes:
        - directus-uploads:/directus/uploads
        - directus-extensions:/directus/extensions
        - directus-templates:/directus/templates
      environment:
        - KEY=$SERVICE_BASE64_64_KEY
        - SECRET=$SERVICE_BASE64_64_SECRET
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
        - ADMIN_PASSWORD=$SERVICE_PASSWORD_ADMIN
        - DB_CLIENT=postgres
        - DB_HOST=postgresql
        - DB_PORT=5432
        - DB_DATABASE=${POSTGRESQL_DATABASE:-directus}
        - DB_USER=$SERVICE_USER_POSTGRESQL
        - DB_PASSWORD=$SERVICE_PASSWORD_POSTGRESQL
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - WEBSOCKETS_ENABLED=true
        - CORS_ENABLED=${CORS_ENABLED:-true}
        - CORS_ORIGIN=${CORS_ORIGIN}
        - CORS_METHODS=${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}
        - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
        - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
      healthcheck:
        test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8055/admin/login"]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
    postgresql:
      image: postgis/postgis:16-3.4-alpine
      platform: linux/amd64
      volumes:
        - directus-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-directus}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7-alpine
      command: redis-server --appendonly yes
      volumes:
        - directus-redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    directus-uploads: {}
    directus-extensions: {}
    directus-templates: {}
    directus-postgresql-data: {}
    directus-redis-data: {}
