# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "Grafana"
description: "Dashboards and alerts over metrics, logs and databases."
icon: insights
category: monitoring
website: "https://grafana.com"
docs: "https://grafana.com/docs/"
main: grafana
port: 3000
env:
  GF_SECURITY_ADMIN_PASSWORD: "$generate:password"
compose: |
  services:
    grafana:
      image: grafana/grafana-oss:latest
      restart: unless-stopped
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      volumes:
        - data:/var/lib/grafana
  volumes:
    data: {}
