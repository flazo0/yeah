# Template de serviço do yeah. Campos: name, description, icon (Material Symbols), category, tags, main (serviço que recebe o domínio),
# port (porta desse serviço), env (valores iniciais; "$generate:password|hex|base64" gera um segredo novo a cada instância) e compose.
name: "Grafana"
description: "Dashboards e alertas sobre métricas, logs e bancos."
icon: insights
category: monitoring
website: "https://grafana.com"
docs: "https://grafana.com/docs/"
main: grafana
port: 3000
env:
  GF_SECURITY_ADMIN_PASSWORD: "$generate:password"
compose: |
  services:
    grafana:
      image: grafana/grafana-oss:latest
      restart: unless-stopped
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      volumes:
        - data:/var/lib/grafana
  volumes:
    data: {}
