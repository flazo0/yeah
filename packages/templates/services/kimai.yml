# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Kimai"
description: "Open source time-tracking app."
icon: task_alt
logo: "kimai.svg"
category: productivity
tags: ["time-tracking", "open-source"]
docs: "https://www.kimai.org/"
main: "kimai"
port: 8001
env:
  SERVICE_USER_MYSQL: "$generate:user"
  SERVICE_PASSWORD_MYSQL: "$generate:password"
  SERVICE_PASSWORD_ROOT: "$generate:password"
  SERVICE_PASSWORD_APPSECRET: "$generate:password"
  SERVICE_PASSWORD_ADMINPASS: "$generate:password"
  MYSQL_DATABASE: "kimai"
  TRUSTED_HOSTS: ""
compose: |
  services:
    mysql:
      image: mysql:8
      volumes:
        - kimai-mysql-data:/var/lib/mysql
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE:-kimai}
        - MYSQL_USER=${SERVICE_USER_MYSQL}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      command: --default-storage-engine innodb
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
        interval: 5s
        timeout: 20s
        retries: 10
    kimai:
      image: kimai/kimai2:apache
      container_name: kimai
      depends_on:
        mysql:
          condition: service_healthy
      volumes:
        - kimai-data:/opt/kimai/var/data
      environment:
        - APP_SECRET=${SERVICE_PASSWORD_APPSECRET}
        - MAILER_FROM=${MAILER_FROM:-kimai@example.com}
        - MAILER_URL=${MAILER_URL:-null://null}
        - ADMINMAIL=${ADMINMAIL:-admin@kimai.local}
        - ADMINPASS=${SERVICE_PASSWORD_ADMINPASS}
        - DATABASE_URL=mysql://${SERVICE_USER_MYSQL}:${SERVICE_PASSWORD_MYSQL}@mysql/${MYSQL_DATABASE}?charset=utf8mb4&serverVersion=8.3.0
        - 'TRUSTED_HOSTS=${TRUSTED_HOSTS}|localhost|127.0.0.1'
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:8001"]
        interval: 2s
        timeout: 10s
        retries: 15

  volumes:
    kimai-mysql-data: {}
    kimai-data: {}
