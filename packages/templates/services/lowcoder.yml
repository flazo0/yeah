# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Lowcoder"
description: "Lowcoder (forked from OpenBlocks) is a self-hosted, open-source, low-code platform for building internal tools."
icon: task_alt
logo: "lowcoder.svg"
category: productivity
tags: ["lowcoder", "openblocks", "low", "code", "platform", "open", "source", "low"]
docs: "https://docs.lowcoder.cloud/"
main: "lowcoder"
port: 3000
env:
  SERVICE_PASSWORD_ENCRYPTION: "$generate:password"
  SERVICE_PASSWORD_SALT: "$generate:password"
compose: |
  services:
    lowcoder:
      image: lowcoderorg/lowcoder-ce
      environment:
        - LOWCODER_EMAIL_SIGNUP_ENABLED=${LOWCODER_EMAIL_SIGNUP_ENABLED:-true}
        - LOWCODER_DB_ENCRYPTION_PASSWORD=${SERVICE_PASSWORD_ENCRYPTION}
        - LOWCODER_DB_ENCRYPTION_SALT=${SERVICE_PASSWORD_SALT}
      volumes:
        - lowcoder_data:/lowcoder-stacks
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
        interval: 5s
        timeout: 20s
        retries: 10
