# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Qdrant"
description: "Qdrant is a vector similarity search engine that provides a production-ready service with a convenient API to store, search, and manage points (i.e. vectors) with an additional payload."
icon: database
logo: "qdrant.png"
category: database
tags: ["ai", "vector-database", "semantic-search", "machine-learning", "bm25", "embeddings", "llm"]
docs: "https://qdrant.tech/documentation/"
main: "qdrant"
port: 6333
env:
  SERVICE_PASSWORD_QDRANTAPIKEY: "$generate:password"
compose: |
  services:
    qdrant:
      image: "qdrant/qdrant:latest"
      environment:
        - QDRANT__SERVICE__API_KEY=${SERVICE_PASSWORD_QDRANTAPIKEY}
      volumes:
        - "qdrant-storage:/qdrant/storage"
      healthcheck:
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
        interval: 5s
        timeout: 5s
        retries: 3

  volumes:
    qdrant-storage: {}
