# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Swetrix"
description: "Privacy-friendly and cookieless European web analytics alternative to Google Analytics."
icon: analytics
logo: "swetrix.svg"
category: analytics
tags: ["analytics", "privacy", "monitoring", "open-source", "clickhouse", "redis"]
docs: "https://docs.swetrix.com/selfhosting/how-to"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "swetrix"
port: 3000
env:
  SERVICE_URL_SWETRIXAPI: "http://localhost"
  SERVICE_BASE64_64_SECRETKEYBASE: "$generate:base64long"
  SERVICE_PASSWORD_CLICKHOUSE: "$generate:password"
  SERVICE_PASSWORD_REDIS: "$generate:password"
files:
  "disable-user-logging.xml": "<clickhouse>\n  <profiles>\n    <default>\n      <log_queries>0</log_queries>\n      <log_query_threads>0</log_query_threads>\n    </default>\n  </profiles>\n</clickhouse>\n"
  "reduce-logs.xml": "<clickhouse>\n  <logger>\n    <level>warning</level>\n    <console>true</console>\n  </logger>\n  <query_thread_log remove=\"remove\"/>\n  <query_log remove=\"remove\"/>\n  <text_log remove=\"remove\"/>\n  <trace_log remove=\"remove\"/>\n  <metric_log remove=\"remove\"/>\n  <asynchronous_metric_log remove=\"remove\"/>\n  <session_log remove=\"remove\"/>\n  <part_log remove=\"remove\"/>\n</clickhouse>\n"
  "preserve-ram-config.xml": "<clickhouse>\n  <mark_cache_size>536870912</mark_cache_size>\n  <concurrent_threads_soft_limit_num>1</concurrent_threads_soft_limit_num>\n</clickhouse>\n"
  "preserve-ram-user.xml": "<clickhouse>\n  <profiles>\n    <default>\n      <max_block_size>2048</max_block_size>\n      <max_download_threads>1</max_download_threads>\n      <input_format_parallel_parsing>0</input_format_parallel_parsing>\n      <output_format_parallel_formatting>0</output_format_parallel_formatting>\n    </default>\n  </profiles>\n</clickhouse>\n"
compose: |
  services:
    swetrix:
      image: swetrix/swetrix-fe:v4.0.5
      depends_on:
        - swetrix-api
      environment:
        - API_URL=$SERVICE_URL_SWETRIXAPI
      healthcheck:
        test:
          - CMD-SHELL
          - wget --no-verbose --tries=1 --spider http://localhost:3000/ping || exit 1
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 15s

    swetrix-api:
      image: swetrix/swetrix-api:v4.0.5
      environment:
        # Required
        - SECRET_KEY_BASE=$SERVICE_BASE64_64_SECRETKEYBASE

        # Optional
        - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
        - IP_GEOLOCATION_DB_PATH=${IP_GEOLOCATION_DB_PATH:-}
        - DEBUG_MODE=${DEBUG_MODE:-false}
        - CLOUDFLARE_PROXY_ENABLED=${CLOUDFLARE_PROXY_ENABLED:-false}

        # SMTP (optional)
        - SMTP_HOST=${SMTP_HOST:-}
        - SMTP_PORT=${SMTP_PORT:-}
        - SMTP_USER=${SMTP_USER:-}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-}
        - FROM_EMAIL=${FROM_EMAIL:-}
        - SMTP_MOCK=${SMTP_MOCK:-false}

        # OIDC (optional)
        - OIDC_ENABLED=${OIDC_ENABLED:-false}
        - OIDC_ONLY_AUTH=${OIDC_ONLY_AUTH:-false}
        - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
        - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
        - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}

        # Required service endpoints
        - REDIS_HOST=redis
        - CLICKHOUSE_HOST=http://clickhouse
        - CLICKHOUSE_PASSWORD=$SERVICE_PASSWORD_CLICKHOUSE
        - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      depends_on:
        redis:
          condition: service_healthy
        clickhouse:
          condition: service_healthy
      healthcheck:
        test:
          - CMD-SHELL
          - wget --no-verbose --tries=1 --spider http://localhost:5005/ping || exit 1
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 15s

    redis:
      image: redis:8.2-alpine
      environment:
        - REDIS_PORT=${REDIS_PORT:-6379}
        - REDIS_USER=${REDIS_USER:-default}
        - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      healthcheck:
        test:
          - CMD-SHELL
          - redis-cli ping | grep PONG
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 1m

    clickhouse:
      image: clickhouse/clickhouse-server:24.10-alpine
      environment:
        - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-analytics}
        - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
        - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
        - CLICKHOUSE_PASSWORD=$SERVICE_PASSWORD_CLICKHOUSE
      healthcheck:
        test:
          - CMD-SHELL
          - wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 1m
      cap_add:
        - SYS_NICE
      volumes:
        # Persistent storage for ClickHouse
        - swetrix-events-data:/var/lib/clickhouse

        # Disable logging
        - ./disable-user-logging.xml:/etc/clickhouse-server/users.d/disable-user-logging.xml:ro
        - ./reduce-logs.xml:/etc/clickhouse-server/config.d/reduce-logs.xml:ro

        # Reduce RAM usage
        - ./preserve-ram-config.xml:/etc/clickhouse-server/config.d/preserve-ram-config.xml:ro
        - ./preserve-ram-user.xml:/etc/clickhouse-server/users.d/preserve-ram-user.xml:ro

      ulimits:
        nofile:
          soft: 262144
          hard: 262144

  volumes:
    swetrix-events-data: {}
