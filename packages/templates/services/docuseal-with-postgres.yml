# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Docuseal With Postgres"
description: "Document Signing for Everyone free forever for individuals, extensible for businesses and developers. Open Source Alternative to DocuSign, PandaDoc and more."
icon: task_alt
logo: "docuseal-with-postgres.png"
category: productivity
tags: ["documentation"]
docs: "https://www.docuseal.co/"
main: "docuseal"
port: 3000
env:
  SERVICE_URL_DOCUSEAL: "http://localhost"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  POSTGRES_DB: ""
compose: |
  services:
    docuseal:
      image: docuseal/docuseal:latest
      environment:
        - HOST=${SERVICE_URL_DOCUSEAL}
        - DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DB}
      volumes:
        - docuseal-data:/data
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
        interval: 5s
        timeout: 20s
        retries: 10
    postgresql:
      image: postgres:16-alpine
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-docuseal}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
