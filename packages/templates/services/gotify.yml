# Template de serviço do yeah. Campos: name, description, icon (Material Symbols), category, tags, main (serviço que recebe o domínio),
# port (porta desse serviço), env (valores iniciais; "$generate:password|hex|base64" gera um segredo novo a cada instância) e compose.
name: "Gotify"
description: "Servidor de notificações push próprio, com API simples."
icon: notifications
category: messaging
website: "https://gotify.net"
notes: "Usuário inicial: admin."
main: gotify
port: 80
env:
  GOTIFY_DEFAULTUSER_PASS: "$generate:password"
compose: |
  services:
    gotify:
      image: gotify/server:latest
      restart: unless-stopped
      environment:
        - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_DEFAULTUSER_PASS}
      volumes:
        - data:/app/data
  volumes:
    data: {}
