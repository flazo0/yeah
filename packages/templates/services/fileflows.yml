# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Fileflows"
description: "FileFlows can drastically reduce your files, up to 90%, saving you space and money. No need to buy more hard drives, just shrink your files and start saving."
icon: movie
logo: "fileflows.svg"
category: media
tags: ["media", "transcode", "convert", "h265"]
docs: "https://fileflows.com/docs/"
main: "fileflows"
port: 5000
env:
  SERVICE_URL_FILE_FLOWS: "http://localhost"
compose: |
  services:
    fileflows:
      image: revenz/fileflows
      environment:
        - _APP_URL=$SERVICE_URL_FILE_FLOWS
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-America/Toronto}
      #devices:
      #  - "/dev/dri:/dev/dri" # Enable hardware transcoding
      volumes:
        - fileflows_temp:/temp
        - fileflows_configs:/app/Data
        - fileflows_logs:/app/Logs
        - fileflows_common:/app/common

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:5000/api/system/version"]
        interval: 2s
        timeout: 10s
        retries: 15

  volumes:
    fileflows_temp: {}
    fileflows_configs: {}
    fileflows_logs: {}
    fileflows_common: {}
