# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Spacebot"
description: "An agentic AI system with specialized processes for thinking, working, and remembering."
icon: psychology
logo: "spacebot.png"
category: ai
tags: ["ai", "agent", "anthropic", "openai", "discord", "slack", "llm", "agentic"]
docs: "https://docs.spacebot.sh/docker"
main: "spacebot"
port: 19898
env:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  DISCORD_BOT_TOKEN: ""
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  BRAVE_SEARCH_API_KEY: ""
  SPACEBOT_CHANNEL_MODEL: ""
  SPACEBOT_WORKER_MODEL: ""
compose: |
  services:
    spacebot:
      image: "ghcr.io/spacedriveapp/spacebot:full"
      environment:
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
        - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
        - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
        - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
        - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
        - SPACEBOT_CHANNEL_MODEL=${SPACEBOT_CHANNEL_MODEL}
        - SPACEBOT_WORKER_MODEL=${SPACEBOT_WORKER_MODEL}
      volumes:
        - "spacebot-data:/data"
      security_opt:
        - seccomp=unconfined
      shm_size: 1g
      healthcheck:
        test: ["CMD", "curl", "-sf", "http://localhost:19898/api/health"]
        interval: 30s
        timeout: 5s
        retries: 3
