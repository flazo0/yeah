# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Mixpost"
description: "Mixpost is a robust and versatile social media management software, designed to streamline social media operations and enhance content marketing strategies."
icon: analytics
logo: "mixpost.svg"
category: analytics
tags: ["social media", "marketing", "content", "management", "automation", "self-hosted"]
docs: "https://docs.mixpost.app/lite"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "mixpost"
port: 80
env:
  SERVICE_BASE64_MIXPOST: "$generate:base64"
  SERVICE_URL_MIXPOST: "http://localhost"
  SERVICE_USER_MYSQL: "$generate:user"
  SERVICE_PASSWORD_MYSQL: "$generate:password"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
  SERVICE_PASSWORD_MYSQLROOT: "$generate:password"
files:
  "etc/coolify-start.sh": "#!/bin/sh\n# start.sh always creates admin@example.com with the password \"changeme\".\n# Replace that password with ADMIN_PASSWORD once, while it is still the default.\n(\n  for i in $(seq 1 60); do\n    sleep 5\n    result=$(php /var/www/html/artisan tinker --no-ansi --execute='$u = Inovector\\MixpostAuth\\MixpostAuth::getUserClass()::where(\"email\", \"admin@example.com\")->first(); if (! $u) { echo \"wait\"; } elseif (Illuminate\\Support\\Facades\\Hash::check(\"changeme\", $u->password)) { $u->password = bcrypt(getenv(\"ADMIN_PASSWORD\")); $u->save(); echo \"done\"; } else { echo \"done\"; }' 2>/dev/null)\n    [ \"$result\" = \"done\" ] && break\n  done\n) &\nexec /usr/local/bin/start.sh\n"
compose: |
  services:
    mixpost:
      image: 'inovector/mixpost:latest'
      environment:
        - APP_NAME=Mixpost
        - APP_KEY=${SERVICE_BASE64_MIXPOST}
        - APP_DEBUG=false
        - APP_DOMAIN=${SERVICE_URL_MIXPOST}
        - APP_URL=${SERVICE_URL_MIXPOST}
        - DB_DATABASE=${MYSQL_DATABASE:-mixpost_db}
        - DB_USERNAME=${SERVICE_USER_MYSQL}
        - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - SSL_EMAIL=${SSL_EMAIL:-user@example.com}
        - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      volumes:
        - mixpost-storage:/var/www/html/storage/app
        - mixpost-logs:/var/www/html/storage/logs
        - ./etc/coolify-start.sh:/usr/local/bin/coolify-start.sh
      entrypoint: ["/usr/local/bin/coolify-start.sh"]
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/mixpost/login || exit 1"]
        start_period: 60s
        interval: 10s
        timeout: 10s
        retries: 10
      depends_on:
        - mysql
        - redis
    mysql:
      image: 'mysql/mysql-server:8.0'
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE:-mixpost_db}
        - MYSQL_USER=${SERVICE_USER_MYSQL}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
      volumes:
        - mixpost-mysql:/var/lib/mysql
      healthcheck:
        test:
          - CMD
          - mysqladmin
          - ping
          - '-h'
          - 127.0.0.1
          - '-uroot'
          - '-p${SERVICE_PASSWORD_MYSQLROOT}'
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: 'redis:alpine'
      healthcheck:
        test:
          - CMD
          - redis-cli
          - '--raw'
          - incr
          - ping

  volumes:
    mixpost-storage: {}
    mixpost-logs: {}
    mixpost-mysql: {}
