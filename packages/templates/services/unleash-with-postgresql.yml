# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Unleash With Postgresql"
description: "Open source feature flag management for enterprises."
icon: code
logo: "unleash-with-postgresql.svg"
category: dev
tags: ["unleash", "feature flags", "feature toggles", "ab testing", "open source"]
docs: "https://docs.getunleash.io"
main: "unleash"
port: 4242
env:
  SERVICE_URL_UNLEASH: "http://localhost"
  SERVICE_PASSWORD_UNLEASH: "$generate:password"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
compose: |
  services:
    unleash:
      image: "unleashorg/unleash-server:latest"
      environment:
        - UNLEASH_URL=${SERVICE_URL_UNLEASH}
        - UNLEASH_DEFAULT_ADMIN_PASSWORD=${SERVICE_PASSWORD_UNLEASH}
        - "DATABASE_URL=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres/db"
        - DATABASE_SSL=false
        - LOG_LEVEL=warn
        - INIT_FRONTEND_API_TOKENS=default:default:development.unleash-insecure-frontend-api-token
        - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: "wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit 1"
        interval: 1s
        timeout: 1m
        retries: 5
        start_period: 15s
    postgres:
      image: postgres:15
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=db
      healthcheck:
        test:
          - CMD
          - pg_isready
          - "--username=$SERVICE_USER_POSTGRES"
          - "--host=127.0.0.1"
          - "--port=5432"
          - "--dbname=db"
        interval: 2s
        timeout: 1m
        retries: 5
        start_period: 10s
