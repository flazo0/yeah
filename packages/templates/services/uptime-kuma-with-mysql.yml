name: "Uptime Kuma With Mysql"
description: "Uptime Kuma is a monitoring tool for tracking the status and performance of your applications in real-time."
icon: monitor_heart
logo: "uptime-kuma-with-mysql.svg"
category: monitoring
tags: ["monitoring", "status", "performance", "web", "services", "applications", "real-time"]
docs: "https://github.com/louislam/uptime-kuma?tab=readme-ov-file"
main: "uptime-kuma"
port: 3001
env:
  SERVICE_USER_MYSQL: "$generate:user"
  SERVICE_PASSWORD_MYSQL: "$generate:password"
  SERVICE_PASSWORD_ROOT: "$generate:password"
compose: |
  services:
    uptime-kuma:
      image: louislam/uptime-kuma:2
      environment:
        - TZ=${TZ:-Etc/UTC}
      volumes:
        - uptime-kuma-data:/app/data
      healthcheck:
        test: ["CMD-SHELL", "extra/healthcheck"]
        interval: 5s
        timeout: 5s
        retries: 10
      depends_on:
        mysql:
          condition: service_healthy

    mysql:
      image: mysql:8
      environment:
        - MYSQL_USER=${SERVICE_USER_MYSQL}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-uptime-kuma-db}
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
        interval: 5s
        timeout: 20s
        retries: 10
      volumes:
        - mysql-data:/var/lib/mysql

  volumes:
    uptime-kuma-data: {}
    mysql-data: {}
