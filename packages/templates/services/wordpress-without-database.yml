# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Wordpress Without Database"
description: "WordPress is open source software you can use to create a beautiful website, blog, or app."
icon: language
logo: "wordpress-without-database.svg"
category: cms
tags: ["cms", "blog", "content", "management"]
docs: "https://wordpress.org"
main: "wordpress"
port: 80
env: {}
compose: |
  services:
    wordpress:
      image: wordpress:latest
      volumes:
        - wordpress-files:/var/www/html
      environment:
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1"]
        interval: 2s
        timeout: 10s
        retries: 10
