# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "SearXNG"
description: "Metabuscador privado, sem rastreamento."
icon: travel_explore
category: search
website: "https://docs.searxng.org"
main: searxng
port: 8080
env:
  SEARXNG_SECRET: "$generate:hex"
compose: |
  services:
    searxng:
      image: searxng/searxng:latest
      restart: unless-stopped
      environment:
        - SEARXNG_SECRET=${SEARXNG_SECRET}
      volumes:
        - config:/etc/searxng
  volumes:
    config: {}
