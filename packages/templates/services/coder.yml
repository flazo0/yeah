# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Coder"
description: "Coder is an open-source platform for creating and managing cloud development environments on your infrastructure, with the tools and IDEs your developers already love."
icon: code
logo: "coder.svg"
category: dev
tags: ["coder", "development", "environment", "self-hosted", "postgres"]
docs: "https://coder.com/docs"
main: "coder"
port: 7080
env:
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  SERVICE_URL_CODER: "http://localhost"
compose: |
  services:
    coder:
      image: ghcr.io/coder/coder:latest
      environment:
        - CODER_PG_CONNECTION_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@coder-database/${POSTGRES_DB:-coder-db}?sslmode=disable
        - CODER_HTTP_ADDRESS=0.0.0.0:7080
        - CODER_ACCESS_URL=${SERVICE_URL_CODER}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      depends_on:
        coder-database:
          condition: service_healthy
      healthcheck:
        test:
          - CMD
          - wget
          - "-q"
          - "--spider"
          - "http://localhost:7080"
        interval: 5s
        timeout: 20s
        retries: 10

    coder-database:
      image: postgres:16.4-alpine
      environment:
        POSTGRES_USER: "${SERVICE_USER_POSTGRES}"
        POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"
        POSTGRES_DB: "${POSTGRES_DB:-coder-db}"
      volumes:
        - coder-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test:
          - CMD-SHELL
          - "pg_isready -U ${POSTGRES_USER:-username} -d ${POSTGRES_DB:-coder}"
        interval: 5s
        timeout: 5s
        retries: 5
