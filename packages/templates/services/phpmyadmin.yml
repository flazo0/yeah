# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Phpmyadmin"
description: "phpMyAdmin is a web-based database management tool for administering your MySQL and MariaDB databases through a user-friendly interface."
icon: database
logo: "phpmyadmin.svg"
category: database
tags: ["database management"]
docs: "https://phpmyadmin.net"
main: "phpmyadmin"
port: 80
env:
  SERVICE_URL_PHPMYADMIN: "http://localhost"
compose: |
  services:
    phpmyadmin:
      image: lscr.io/linuxserver/phpmyadmin:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Madrid
        - PMA_ARBITRARY=1
        - PMA_ABSOLUTE_URI=$SERVICE_URL_PHPMYADMIN
      volumes:
        - phpmyadmin-config:/config
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
        interval: 2s
        timeout: 10s
        retries: 15
