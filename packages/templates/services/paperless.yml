# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Paperless-ngx"
description: "Paperless-ngx is a community-supported open-source document management system that transforms your physical documents into a searchable online archive so you can keep, well, less paper."
icon: task_alt
logo: "paperless.svg"
category: productivity
docs: "https://docs.paperless-ngx.com/configuration/"
main: "paperless"
port: 8000
env:
  SERVICE_URL_PAPERLESS: "http://localhost"
  SERVICE_PASSWORD_PAPERLESS: "$generate:password"
  SERVICE_USER_PAPERLESS: "$generate:user"
  SERVICE_REALBASE64_64_PAPERLESS: "$generate:realbase64"
dirs: ["export", "consume"]
compose: |
  services:
    redis:
      image: redis:7.4
      volumes:
        - paperless-redis:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        timeout: 10s
        retries: 3

    paperless:
      image: paperlessngx/paperless-ngx:latest
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
        interval: 30s
        timeout: 10s
        retries: 5
      volumes:
        - paperless-data:/usr/src/paperless/data
        - paperless-media:/usr/src/paperless/media
        - ./export:/usr/src/paperless/export
        - ./consume:/usr/src/paperless/consume
      environment:
        - PAPERLESS_URL=$SERVICE_URL_PAPERLESS
        - PAPERLESS_ADMIN_PASSWORD=${SERVICE_PASSWORD_PAPERLESS}
        - PAPERLESS_ADMIN_USER=${SERVICE_USER_PAPERLESS}
        - PAPERLESS_REDIS=redis://redis:6379
        - PAPERLESS_SECRET_KEY=${SERVICE_REALBASE64_64_PAPERLESS}

  volumes:
    paperless-redis: {}
    paperless-data: {}
    paperless-media: {}
