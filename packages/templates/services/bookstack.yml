# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Bookstack"
description: "BookStack is a simple, self-hosted, easy-to-use platform for organising and storing information"
icon: language
logo: "bookstack.png"
category: cms
tags: ["free-and-open-source", "mfa", "dark-light-themes", "searchable", "connected", "simple-interface", "diagramms", "notes"]
docs: "https://www.bookstackapp.com/docs/"
main: "bookstack"
port: 80
env:
  SERVICE_URL_BOOKSTACK: "http://localhost"
  SERVICE_PASSWORD_APPKEY: "$generate:password"
  SERVICE_USER_MYSQL: "$generate:user"
  SERVICE_PASSWORD_MYSQL: "$generate:password"
  QUEUE_CONNECTION: ""
  GITHUB_APP_ID: ""
  GITHUB_APP_SECRET: ""
  MAIL_HOST: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: ""
  SERVICE_PASSWORD_MYSQLROOT: "$generate:password"
compose: |
  services:
    bookstack:
      image: lscr.io/linuxserver/bookstack:latest
      environment:
        - APP_URL=${SERVICE_URL_BOOKSTACK}
        - APP_KEY=${SERVICE_PASSWORD_APPKEY}
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Berlin}
        - DB_HOST=mariadb
        - DB_PORT=3306
        - DB_USERNAME=${SERVICE_USER_MYSQL}
        - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
        - DB_DATABASE=${MYSQL_DATABASE:-bookstackapp}
        - QUEUE_CONNECTION=${QUEUE_CONNECTION}
        # You will need to set up an authentication provider as described at https://www.bookstackapp.com/docs/admin/third-party-auth/.
        - GITHUB_APP_ID=${GITHUB_APP_ID}
        - GITHUB_APP_SECRET=${GITHUB_APP_SECRET}
        # SMTP Mail variables as per https://www.bookstackapp.com/docs/admin/email-webhooks/#email-configuration/.
        - MAIL_DRIVER=${MAIL_DRIVER:-smtp}
        - MAIL_HOST=${MAIL_HOST}
        - MAIL_PORT=${MAIL_PORT:-587}
        - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
        - MAIL_USERNAME=${MAIL_USERNAME}
        - MAIL_PASSWORD=${MAIL_PASSWORD}
        - MAIL_FROM=${MAIL_FROM}
        - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BookStack}
      volumes:
        - 'bookstack-data:/config'
      healthcheck:
        test:
          - CMD-SHELL
          - 'curl -f http://127.0.0.1:80/'
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        mariadb:
          condition: service_healthy

    mariadb:
      image: lscr.io/linuxserver/mariadb:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Berlin}
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-bookstack}
        - MYSQL_USER=${SERVICE_USER_MYSQL}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      volumes:
        - 'bookstack-mariadb-data:/config'
      healthcheck:
        test:
          - CMD
          - mysqladmin
          - ping
          - '-h'
          - 127.0.0.1
        interval: 5s
        timeout: 20s
        retries: 10
