# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Siyuan"
description: "A privacy-first, self-hosted, fully open source personal knowledge management software, written in typescript and golang."
icon: task_alt
logo: "siyuan.svg"
category: productivity
tags: ["note-taking", "markdown", "pkm"]
docs: "https://github.com/siyuan-note/siyuan"
main: "siyuan"
port: 6806
env:
  SERVICE_PASSWORD_SIYUAN: "$generate:password"
compose: |
  services:
    siyuan:
      image: b3log/siyuan:v3.3.5
      volumes:
        - 'siyuan_workspace:/siyuan/workspace'
      environment:
        - TZ=${TZ:-UTC}
        - PUID=1000
        - PGID=1000
        - 'SIYUAN_ACCESS_AUTH_CODE=${SERVICE_PASSWORD_SIYUAN}'
      healthcheck:
        test:
          - CMD
          - wget
          - '--spider'
          - '--quiet'
          - 'http://127.0.0.1:6806/api/system/version'
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 20s
