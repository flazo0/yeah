# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Macos"
description: "Run macOS in a containerized environment."
icon: task_alt
logo: "macos.svg"
category: productivity
tags: ["macos", "virtualization", "container", "os"]
docs: "https://github.com/dockur/macos"
main: "macos"
port: 8006
env: {}
compose: |
  services:
    macos:
      image: dockurr/macos
      volumes:
        - macos-storage:/storage
      environment:
        - VERSION=15
      devices:
        - /dev/kvm:/dev/kvm
      cap_add:
        - NET_ADMIN
      stop_grace_period: 2m
      healthcheck:
        test: ["CMD", "nc", "-z", "127.0.0.1", "8006"]
        interval: 2s
        timeout: 10s
        retries: 10

  volumes:
    macos-storage: {}
