# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "MinIO"
description: "S3-compatible object storage — use it as a backup destination for yeah itself."
icon: cloud
category: storage
website: "https://min.io"
docs: "https://min.io/docs/minio/linux/index.html"
notes: "The console is on port 9001 (the main domain); the S3 API is on 9000 — add a second domain for it in the Domains tab."
main: minio
port: 9001
env:
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "$generate:password"
compose: |
  services:
    minio:
      image: quay.io/minio/minio:latest
      command: server /data --console-address :9001
      restart: unless-stopped
      environment:
        - MINIO_ROOT_USER=${MINIO_ROOT_USER}
        - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      volumes:
        - data:/data
  volumes:
    data: {}
