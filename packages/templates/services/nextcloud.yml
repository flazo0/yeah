# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "Nextcloud"
description: "Files, calendar and contacts on your own infrastructure (with MariaDB and Redis)."
icon: folder_shared
category: storage
website: "https://nextcloud.com"
main: nextcloud
port: 80
env:
  DB_PASSWORD: "$generate:password"
  DB_ROOT_PASSWORD: "$generate:password"
compose: |
  services:
    nextcloud:
      image: nextcloud:stable
      restart: unless-stopped
      depends_on:
        - db
        - redis
      environment:
        - MYSQL_HOST=db
        - MYSQL_DATABASE=nextcloud
        - MYSQL_USER=nextcloud
        - MYSQL_PASSWORD=${DB_PASSWORD}
        - REDIS_HOST=redis
      volumes:
        - data:/var/www/html
    db:
      image: mariadb:11
      restart: unless-stopped
      command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
      environment:
        - MARIADB_DATABASE=nextcloud
        - MARIADB_USER=nextcloud
        - MARIADB_PASSWORD=${DB_PASSWORD}
        - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      volumes:
        - db:/var/lib/mysql
    redis:
      image: redis:7-alpine
      restart: unless-stopped
  volumes:
    data: {}
    db: {}
