# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "Meilisearch"
description: "Fast full-text search engine with a simple REST API."
icon: search
category: search
website: "https://www.meilisearch.com"
docs: "https://www.meilisearch.com/docs"
main: meilisearch
port: 7700
env:
  MEILI_MASTER_KEY: "$generate:hex"
compose: |
  services:
    meilisearch:
      image: getmeili/meilisearch:latest
      restart: unless-stopped
      environment:
        - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      volumes:
        - data:/meili_data
  volumes:
    data: {}
