# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Appflowy"
description: "AppFlowy is the AI collaborative workspace where you achieve more without losing control of your data."
icon: task_alt
logo: "appflowy.svg"
category: productivity
tags: ["appflowy", "notion", "open-source", "productivity", "notes", "ai", "self-hosted"]
docs: "https://docs.appflowy.io/docs/documentation/appflowy-cloud"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "nginx"
port: 80
env:
  SERVICE_URL_ADMIN: "http://localhost"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  SERVICE_PASSWORD_JWT: "$generate:password"
  SERVICE_USER_MINIO: "$generate:user"
  SERVICE_PASSWORD_MINIO: "$generate:password"
  SERVICE_URL_APPFLOWYWEB: "http://localhost"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
  GOTRUE_SMTP_HOST: ""
  GOTRUE_SMTP_USER: ""
  GOTRUE_SMTP_PASS: ""
  GOTRUE_SMTP_ADMIN_EMAIL: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_API_VERSION: ""
files:
  "nginx/nginx.conf": "# Please do not directly edit this file.\n\nerror_log  /var/log/nginx/error.log notice;\npid        /var/run/nginx.pid;\n\n\nevents {\n    worker_connections  1024;\n}\n\n\nhttp {\n    resolver 127.0.0.11 valid=10s;\n    map $http_upgrade $connection_upgrade {\n        default upgrade;\n        '' close;\n    }\n\n    server {\n        listen 80;\n        client_max_body_size 10M;\n        underscores_in_headers on;\n\n        # Backend services\n        set $appflowy_cloud_backend \"http://appflowy_cloud:8000\";\n        set $gotrue_backend \"http://gotrue:9999\";\n        set $admin_frontend_backend \"http://admin_frontend:3000\";\n        # GoTrue Authentication Service\n        location /gotrue/ {\n            proxy_pass $gotrue_backend;\n\n            rewrite ^/gotrue(/.*)$ $1 break;\n            \n            # Allow headers like redirect_to to be handed over to the gotrue\n            # for correct redirecting\n            proxy_set_header Host $http_host;\n            proxy_pass_request_headers on;\n        }\n\n        # WebSocket endpoint - handle both /ws and /ws/v2\n        location /ws {\n            proxy_pass $appflowy_cloud_backend;\n\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"Upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_read_timeout 86400s;\n        }\n\n        # API endpoints\n        location /api {\n            proxy_pass $appflowy_cloud_backend;\n            proxy_set_header X-Request-Id $request_id;\n            proxy_set_header Host $http_host;\n\n            # Special handling for publish endpoint\n            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {\n                proxy_pass $appflowy_cloud_backend;\n                proxy_request_buffering off;\n                client_max_body_size 256M;\n            }\n\n            # Chat endpoint (streaming)\n            location /api/chat {\n                proxy_pass $appflowy_cloud_backend;\n\n                proxy_http_version 1.1;\n                proxy_set_header Connection \"\";\n                chunked_transfer_encoding on;\n                proxy_buffering off;\n                proxy_cache off;\n\n                proxy_read_timeout 600s;\n                proxy_connect_timeout 600s;\n                proxy_send_timeout 600s;\n            }\n\n            # Import endpoint\n            location /api/import {\n                proxy_pass $appflowy_cloud_backend;\n\n                proxy_set_header X-Request-Id $request_id;\n                proxy_set_header Host $http_host;\n\n                proxy_read_timeout 600s;\n                proxy_connect_timeout 600s;\n                proxy_send_timeout 600s;\n\n                proxy_request_buffering off;\n                proxy_buffering off;\n                proxy_cache off;\n                client_max_body_size 2G;\n            }\n        }\n\n        # Admin Frontend\n        # Optional Module, comment this section if you did not deploy admin_frontend in docker-compose.yml\n        location /console {\n            proxy_pass $admin_frontend_backend;\n\n            proxy_set_header X-Scheme $scheme;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n\n            proxy_buffering off;\n            proxy_cache off;\n\n            proxy_read_timeout 60s;\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n        }\n\n        # Redirect root path to /console\n        location = / {\n            return 301 /console;\n        }\n\n        # Health check endpoint\n        location /health {\n            access_log off;\n            return 200 \"healthy\\n\";\n            add_header Content-Type text/plain;\n        }\n    }\n}\n"
compose: |
  services:
    nginx:
      image: nginx:1.29.2
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - appflowy_cloud
        - gotrue
        - admin_frontend
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost/health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

    appflowy_web:
      environment:
        - APPFLOWY_BASE_URL=${SERVICE_URL_ADMIN}
        - APPFLOWY_GOTRUE_BASE_URL=${SERVICE_URL_ADMIN}/gotrue
        - APPFLOWY_WS_BASE_URL=${SERVICE_URL_ADMIN}/ws/v2
      image: appflowyinc/appflowy_web:0.9.132
      depends_on:
        - appflowy_cloud

    appflowy_cloud:
      image: appflowyinc/appflowy_cloud:0.9.149
      environment:
        - RUST_LOG=${RUST_LOG:-info}
        - APPFLOWY_BASE_URL=${SERVICE_URL_ADMIN}
        - APPFLOWY_ENVIRONMENT=production
        - APPFLOWY_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
        - APPFLOWY_REDIS_URI=redis://redis:6379
        - APPFLOWY_GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
        - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
        - APPFLOWY_S3_CREATE_BUCKET=${APPFLOWY_S3_CREATE_BUCKET:-true}
        - APPFLOWY_S3_USE_MINIO=true
        - APPFLOWY_S3_MINIO_URL=http://minio:9000
        - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
        - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
        - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
        - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
        - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST:-smtp.gmail.com}
        - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT:-587}
        - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME:-notify@appflowy.io}
        - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL:-notify@appflowy.io}
        - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD:-email_sender_password}
        - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND:-none}
        - APPFLOWY_ACCESS_CONTROL=true
        - APPFLOWY_DATABASE_MAX_CONNECTIONS=40
        - AI_SERVER_HOST=ai
        - AI_SERVER_PORT=5001
        - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
        - APPFLOWY_WEB_URL=${SERVICE_URL_APPFLOWYWEB}
      healthcheck:
        test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
        interval: 5s
        timeout: 5s
        retries: 12
      
      depends_on:
        gotrue:
          condition: service_healthy
        postgres:
          condition: service_healthy
        redis:
          condition: service_started

    gotrue:
      image: appflowyinc/gotrue:0.9.149
      environment:
        - GOTRUE_API_HOST=0.0.0.0
        - GOTRUE_API_PORT=9999
        - PORT=9999
        - GOTRUE_ADMIN_EMAIL=${GOTRUE_ADMIN_EMAIL:-admin@example.com}
        - GOTRUE_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
        - GOTRUE_DISABLE_SIGNUP=false
        - GOTRUE_SITE_URL=appflowy-flutter://
        - GOTRUE_URI_ALLOW_LIST=**
        - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
        - GOTRUE_JWT_EXP=${GOTRUE_JWT_EXP:-7200}
        - GOTRUE_DB_DRIVER=postgres
        - API_EXTERNAL_URL=${SERVICE_URL_ADMIN}/gotrue
        - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}?search_path=auth
        - GOTRUE_SMTP_HOST=${GOTRUE_SMTP_HOST}
        - GOTRUE_SMTP_PORT=${GOTRUE_SMTP_PORT:-587}
        - GOTRUE_SMTP_USER=${GOTRUE_SMTP_USER}
        - GOTRUE_SMTP_PASS=${GOTRUE_SMTP_PASS}
        - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/verify
        - GOTRUE_MAILER_URLPATHS_INVITE=/verify
        - GOTRUE_MAILER_URLPATHS_RECOVERY=/verify
        - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/verify
        - GOTRUE_SMTP_ADMIN_EMAIL=${GOTRUE_SMTP_ADMIN_EMAIL}
        - GOTRUE_SMTP_MAX_FREQUENCY=1ns
        - GOTRUE_RATE_LIMIT_EMAIL_SENT=100
        - GOTRUE_MAILER_AUTOCONFIRM=true
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: "curl --fail http://127.0.0.1:9999/health || exit 1"
        interval: 5s
        timeout: 5s
        retries: 12

    admin_frontend:
      image: appflowyinc/admin_frontend:0.9.149
      environment:
        - APPFLOWY_GOTRUE_BASE_URL=${SERVICE_URL_ADMIN}/gotrue
        - APPFLOWY_BASE_URL=${SERVICE_URL_ADMIN}
      depends_on:
        gotrue:
          condition: service_healthy
        appflowy_cloud:
          condition: service_started

    ai:
      image: appflowyinc/appflowy_ai:0.9.149
      environment:
        - OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
        - AI_SERVER_PORT=5001
        - DEFAULT_AI_MODEL=gpt-4.1-mini # Make sure the model is available in your OpenAI account
        - DEFAULT_AI_COMPLETION_MODEL=gpt-4.1-mini # Make sure the model is available in your OpenAI account
        - AI_APPFLOWY_HOST=${SERVICE_URL_APPFLOWYWEB}
        - APPFLOWY_GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}

        - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
        - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
        - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
        - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
        - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
        - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
        - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
        - AI_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
        - AI_REDIS_URL=redis://redis:6379
        - AI_USE_MINIO=true
        - AI_MINIO_URL=http://minio:9000
      depends_on:
        postgres:
          condition: service_healthy

    appflowy_worker:
      image: appflowyinc/appflowy_worker:0.9.149
      environment:
        - RUST_LOG=info
        - APPFLOWY_ENVIRONMENT=production
        - APPFLOWY_WORKER_ENVIRONMENT=production
        - APPFLOWY_WORKER_REDIS_URL=redis://redis:6379
        - APPFLOWY_WORKER_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
        - APPFLOWY_WORKER_DATABASE_NAME=${POSTGRES_DB:-appflowy}
        - APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=30
        - APPFLOWY_S3_USE_MINIO=true
        - APPFLOWY_S3_MINIO_URL=http://minio:9000
        - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
        - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
        - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
        - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
        - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST:-smtp.gmail.com}
        - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT:-587}
        - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME:-notify@appflowy.io}
        - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL:-notify@appflowy.io}
        - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD:-email_sender_password}
        - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND:-none}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started

    minio:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      environment:
        - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
        - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      command: server /data --console-address ":9001"
      healthcheck:
        test: ["CMD", "mc", "ready", "local"]
        interval: 30s
        timeout: 20s
        retries: 3
      volumes:
        # Coolify will manage this named volume for persistent object storage.
        - minio_data:/data

    postgres:
      image: pgvector/pgvector:pg16
      environment:
        - POSTGRES_USER=${SERVICE_USER_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-appflowy}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
        - POSTGRES_HOST=postgres
      volumes:
        # Coolify will manage this named volume for persistent database storage.
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD", "pg_isready", "-U", "${SERVICE_USER_POSTGRES}", "-d", "${POSTGRES_DB:-appflowy}" ]
        interval: 5s
        timeout: 5s
        retries: 12

    redis:
      image: redis:8.2.2-alpine3.22
      volumes:
        - "redis_data:/data"
      healthcheck:
        test:
          - CMD-SHELL
          - "redis-cli -h localhost -p 6379 ping"
        interval: 5s
        timeout: 5s
        retries: 3

  volumes:
    minio_data: {}
    postgres_data: {}
    redis_data: {}
