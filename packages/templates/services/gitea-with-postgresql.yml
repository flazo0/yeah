# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Gitea With Postgresql"
description: "Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting."
icon: code
logo: "gitea-with-postgresql.svg"
category: dev
tags: ["version control", "collaboration", "code", "hosting", "lightweight", "postgresql"]
docs: "https://docs.gitea.com"
notes: "Publica portas direto no servidor (`ports:`); confira conflitos com outros recursos."
main: "gitea"
port: 3000
env:
  POSTGRESQL_DATABASE: ""
  SERVICE_USER_POSTGRESQL: "$generate:user"
  SERVICE_PASSWORD_POSTGRESQL: "$generate:password"
compose: |
  services:
    gitea:
      image: gitea/gitea:latest
      environment:
        - USER_UID=1000
        - USER_GID=1000
        - GITEA__database__DB_TYPE=postgres
        - GITEA__database__HOST=postgresql
        - GITEA__database__NAME=${POSTGRESQL_DATABASE-gitea}
        - GITEA__database__USER=$SERVICE_USER_POSTGRESQL
        - GITEA__database__PASSWD=$SERVICE_PASSWORD_POSTGRESQL
      volumes:
        - gitea-data:/data
        - gitea-timezone:/etc/timezone:ro
        - gitea-localtime:/etc/localtime:ro
      ports:
        - 22222:22
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
        interval: 2s
        timeout: 10s
        retries: 15

    postgresql:
      image: postgres:16-alpine
      volumes:
        - gitea-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
        - POSTGRES_DB=${POSTGRESQL_DATABASE}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
