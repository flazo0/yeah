# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Next Image Transformation"
description: "Drop-in replacement for Vercel's Nextjs image optimization service."
icon: movie
logo: "next-image-transformation.svg"
category: media
tags: ["nextjs", "image", "transformation", "service"]
docs: "https://github.com/coollabsio/next-image-transformation"
main: "next-image-transformation"
port: 3000
env: {}
compose: |
  services:
    next-image-transformation:
      image: ghcr.io/coollabsio/next-image-transformation:latest
      environment:
        - NODE_ENV=production
        - ALLOWED_REMOTE_DOMAINS=${ALLOWED_REMOTE_DOMAINS:-*}
        - IMGPROXY_URL=${IMGPROXY_URL:-http://imgproxy:8080}
      healthcheck:
        test: "wget -qO- http://127.0.0.1:3000/health || exit 1"
        interval: 2s
        timeout: 10s
        retries: 5
    imgproxy:
      image: darthsim/imgproxy
      environment:
        - IMGPROXY_ENABLE_WEBP_DETECTION=true
        - IMGPROXY_JPEG_PROGRESSIVE=true
        - IMGPROXY_USE_ETAG=true
      healthcheck:
        test: ["CMD", "imgproxy", "health"]
        interval: 2s
        timeout: 10s
        retries: 5
