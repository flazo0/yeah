name: "Vvveb With Mysql"
description: "Powerful and easy to use cms to build websites, blogs or ecommerce stores."
icon: language
logo: "vvveb-with-mysql.svg"
category: cms
tags: ["cms", "blog", "content", "management", "ecommerce", "page-builder", "nocode", "mysql"]
docs: "https://docs.vvveb.com"
main: "vvveb"
port: 80
env:
  SERVICE_USER_VVVEB: "$generate:user"
  SERVICE_PASSWORD_VVVEB: "$generate:password"
  SERVICE_PASSWORD_ROOT: "$generate:password"
compose: |
  services:
    vvveb:
      image: vvveb/vvvebcms:latest
      volumes:
        - vvveb-data:/var/www/html
      environment:
        - DB_ENGINE=mysqli
        - DB_HOST=mysql
        - DB_USER=${SERVICE_USER_VVVEB}
        - DB_PASSWORD=${SERVICE_PASSWORD_VVVEB}
        - DB_NAME=${MYSQL_DATABASE:-vvveb}
      depends_on:
        mysql:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1"]
        interval: 2s
        timeout: 10s
        retries: 10

    mysql:
      image: mysql:8.4.2
      volumes:
        - vvveb-mysql-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-vvveb}
        - MYSQL_USER=${SERVICE_USER_VVVEB}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_VVVEB}
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    vvveb-data: {}
    vvveb-mysql-data: {}
