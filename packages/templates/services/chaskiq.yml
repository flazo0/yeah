# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Chaskiq"
description: "Chaskiq is an messaging platform for marketing, support & sales"
icon: task_alt
logo: "chaskiq.png"
category: productivity
tags: ["chaskiq", "messaging", "chat", "marketing", "support", "sales", "open", "source"]
docs: "https://chaskiq.io"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "chaskiq"
port: 3000
env:
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  SERVICE_URL_CHASKIQ: "http://localhost"
  SERVICE_URL_CHASKIQ_3000: "http://localhost"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
  SERVICE_PASSWORD_64_SECRET: "$generate:hex"
files:
  "entrypoint.sh": "#!/bin/sh\nset -e\nrm -f /usr/src/app/tmp/pids/server.pid\nexec \"$@\"\necho \"Running database migrations...\"\nbundle exec rails db:setup || true\nbundle exec rails db:migrate\necho \"Finished running database migrations.\"\necho \"Running packages update...\"\nbundle exec rails packages:update\necho \"Finished packages update.\"\nif [ ! -f /usr/src/app/admin_generated ]; then\n    echo \"/usr/src/app/admin_generated not found, executing admin generation..\"\n    bundle exec rake admin_generator\n    touch /usr/src/app/admin_generated\n    echo \"Admin generation finished !\"\nfi\nbundle exec rails s -b 0.0.0.0 -p 3000\n"
compose: |
  services:
    chaskiq:
      image: chaskiq/chaskiq:latest
      environment:
        - REDIS_URL=redis://redis:6379/
        - DATABASE_URL=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DB:-chaskiq}
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - SERVICE_URL=${SERVICE_URL_CHASKIQ}
        - HOST=${SERVICE_URL_CHASKIQ_3000}
        - ASSET_HOST=${SERVICE_URL_CHASKIQ_3000}
        - WS=wss://${SERVICE_URL_CHASKIQ}/cable
        - SNS_CONFIGURATION_SET=metrics
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
        - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
        - AWS_S3_REGION=${AWS_S3_REGION:-}
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example}
        - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
        - DEFAULT_SENDER_EMAIL=${DEFAULT_SENDER_EMAIL:-admin@example}
        - LOCAL_STORAGE_PATH=/data/storage
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
        - SMTP_DELIVERY_METHOD=${SMTP_DELIVERY_METHOD:-}
        - SMTP_ADDRESS=${SMTP_ADDRESS:-}
        - SMTP_USERNAME=${SMTP_USERNAME:-}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-}
        - CHASKIQ_APPSTORE_TOKEN=${CHASKIQ_APPSTORE_TOKEN:-}
        - APP_ENV=production
        - RAILS_ENV=production
        - RACK_ENV=production
        - RAILS_SERVE_STATIC_FILES=true
        - SECRET_KEY_BASE=$SERVICE_PASSWORD_64_SECRET
        - RAILS_LOG_TO_STDOUT=true
        - ENABLED_AUDITS=true
        - TZ=Europe/Madrid
      entrypoint: ["/entrypoint.sh"]
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      volumes:
        - chaskiq-storage:/data/storage
        - ./entrypoint.sh:/entrypoint.sh
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
        interval: 5s
        timeout: 20s
        retries: 15
    sidekiq:
      image: chaskiq/chaskiq:latest
      environment:
        - REDIS_URL=redis://redis:6379/
        - DATABASE_URL=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DB:-chaskiq}
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - HOST=${SERVICE_URL_CHASKIQ_3000}
        - ASSET_HOST=${SERVICE_URL_CHASKIQ_3000}
        - WS=wss://${SERVICE_URL_CHASKIQ}/cable
        - SNS_CONFIGURATION_SET=metrics
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
        - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
        - AWS_S3_REGION=${AWS_S3_REGION:-}
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example}
        - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
        - DEFAULT_SENDER_EMAIL=${DEFAULT_SENDER_EMAIL:-admin@example}
        - LOCAL_STORAGE_PATH=/data/storage
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
        - SMTP_DELIVERY_METHOD=${SMTP_DELIVERY_METHOD:-}
        - SMTP_ADDRESS=${SMTP_ADDRESS:-}
        - SMTP_USERNAME=${SMTP_USERNAME:-}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-}
        - CHASKIQ_APPSTORE_TOKEN=${CHASKIQ_APPSTORE_TOKEN:-}
        - APP_ENV=production
        - RAILS_ENV=production
        - RACK_ENV=production
        - RAILS_SERVE_STATIC_FILES=true
        - SECRET_KEY_BASE=$SERVICE_PASSWORD_64_SECRET
        - RAILS_LOG_TO_STDOUT=true
        - ENABLED_AUDITS=true
        - TZ=Europe/Madrid
      volumes:
        - chaskiq-storage:/data/storage
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
        chaskiq:
          condition: service_healthy
      command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "bundle exec rails runner 'puts Sidekiq.redis(&:info)' > /dev/null 2>&1",
          ]
        interval: 5s
        timeout: 10s
        retries: 15
    postgresql:
      image: postgres:14-alpine
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$SERVICE_USER_POSTGRES
        - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-chaskiq}
        - POSTGRES_INITDB_ARGS= --data-checksums
        - PSQL_HISTFILE=/root/log/.psql_history
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10
    redis:
      image: redis:6-alpine
      restart: always
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 10

  volumes:
    chaskiq-storage: {}
    postgresql-data: {}
    redis-data: {}
