# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Ryot"
description: "Roll your own tracker! Ryot is a self-hosted platform for tracking various aspects of life such as media consumption, fitness activities, and more."
icon: task_alt
logo: "ryot.svg"
category: productivity
tags: ["rss", "reader", "self-hosted", "automation", "tracker", "media", "fitness"]
docs: "https://github.com/ignisda/ryot"
main: "ryot"
port: 8000
env:
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  POSTGRES_DB: ""
  SERVICE_PASSWORD_64_RYOT: "$generate:hex"
compose: |
  services:
    ryot:
      image: ignisda/ryot:v10.3.0
      environment:
        - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB}
        - SERVER_ADMIN_ACCESS_TOKEN=${SERVICE_PASSWORD_64_RYOT}
        - TZ=${TZ:-Europe/Amsterdam}
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
        interval: 5s
        timeout: 20s
        retries: 10

    postgresql:
      image: postgres:16-alpine
      volumes:
        - ryot_postgresql_data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${SERVICE_USER_POSTGRES}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-ryot-db}
        - TZ=${TZ:-Europe/Amsterdam}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    ryot_postgresql_data: {}
