# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Seaweedfs"
description: "SeaweedFS is a simple and highly scalable distributed file system. Compatible with S3, with an admin web interface."
icon: folder
logo: "seaweedfs.svg"
category: storage
tags: ["object", "storage", "server", "s3", "api"]
docs: "https://github.com/seaweedfs/seaweedfs"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "seaweedfs-master"
port: 8333
env:
  SERVICE_USER_S3: "$generate:user"
  SERVICE_PASSWORD_S3: "$generate:password"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  SERVICE_USER_ADMIN: "$generate:user"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
  SEAWEED_USER_ADMIN: ""
  SEAWEED_PASSWORD_ADMIN: ""
files:
  "base-config.json": "{\n  \"identities\": [\n    {\n      \"name\": \"anonymous\",\n      \"actions\": [\n        \"Read\"\n      ]\n    },\n    {\n      \"name\": \"admin\",\n      \"credentials\": [\n        {\n          \"accessKey\": \"env:AWS_ACCESS_KEY_ID\",\n          \"secretKey\": \"env:AWS_SECRET_ACCESS_KEY\"\n        }\n      ],\n      \"actions\": [\n        \"Admin\",\n        \"Read\",\n        \"ReadAcp\",\n        \"List\",\n        \"Tagging\",\n        \"Write\",\n        \"WriteAcp\"\n      ]\n    }\n  ]\n}\n"
compose: |
  services:
    seaweedfs-master:
      image: chrislusf/seaweedfs:4.41
      environment:
        - AWS_ACCESS_KEY_ID=${SERVICE_USER_S3}
        - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_S3}
      volumes:
        - seaweedfs-s3-data:/data
        - ./base-config.json:/base-config.json
      entrypoint: |
        sh -c '\
        sed "s/env:AWS_ACCESS_KEY_ID/$AWS_ACCESS_KEY_ID/g" /base-config.json > /base1-config.json; \
        sed "s/env:AWS_SECRET_ACCESS_KEY/$AWS_SECRET_ACCESS_KEY/g" /base1-config.json > /config.json; \
        weed server -dir=/data -master.port=9333 -s3 -s3.port=8333 -s3.config=/config.json\
        '
      healthcheck:
        test:
          - CMD-SHELL
          - "wget --spider -q http://0.0.0.0:8333; [ $$? -le 8 ]"
        interval: 10s
        timeout: 5s
        retries: 10

    seaweedfs-admin:
      image: chrislusf/seaweedfs:4.41
      environment:
        - SEAWEED_USER_ADMIN=${SERVICE_USER_ADMIN}
        - SEAWEED_PASSWORD_ADMIN=${SERVICE_PASSWORD_ADMIN}
      command:
        - admin
        - "-master=seaweedfs-master:9333"
        - "-adminUser=${SEAWEED_USER_ADMIN}"
        - "-adminPassword=${SEAWEED_PASSWORD_ADMIN}"
        - "-port=23646"
        - "-dataDir=/data"
      volumes:
        - seaweedfs-admin-data:/data
      healthcheck:
        test:
          - CMD-SHELL
          - "wget --spider -q http://0.0.0.0:23646; [ $$? -le 8 ]"
        interval: 10s
        timeout: 5s
        retries: 10
      depends_on:
        seaweedfs-master:
          condition: service_healthy

  volumes:
    seaweedfs-s3-data: {}
    seaweedfs-admin-data: {}
