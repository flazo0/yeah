# Template de serviço do yeah. Campos: name, description, icon (Material Symbols), category, tags, main (serviço que recebe o domínio),
# port (porta desse serviço), env (valores iniciais; "$generate:password|hex|base64" gera um segredo novo a cada instância) e compose.
name: "Mailpit"
description: "Servidor SMTP de teste com caixa de entrada web — nada sai pra internet."
icon: mail
category: dev
website: "https://mailpit.axllent.org"
notes: "SMTP em mailpit:1025 pelo nome interno."
main: mailpit
port: 8025
env: {}
compose: |
  services:
    mailpit:
      image: axllent/mailpit:latest
      restart: unless-stopped
