name: "Wordpress With Mariadb"
description: "WordPress is open source software you can use to create a beautiful website, blog, or app."
icon: language
logo: "wordpress-with-mariadb.svg"
category: cms
tags: ["cms", "blog", "content", "management", "mariadb"]
docs: "https://wordpress.org"
main: "wordpress"
port: 80
env:
  SERVICE_USER_WORDPRESS: "$generate:user"
  SERVICE_PASSWORD_WORDPRESS: "$generate:password"
  SERVICE_PASSWORD_ROOT: "$generate:password"
compose: |
  services:
    wordpress:
      image: wordpress:latest
      volumes:
        - wordpress-files:/var/www/html
      environment:
        - WORDPRESS_DB_HOST=mariadb
        - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
        - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
        - WORDPRESS_DB_NAME=wordpress
      depends_on:
        - mariadb
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1"]
        interval: 2s
        timeout: 10s
        retries: 10
    mariadb:
      image: mariadb:11
      volumes:
        - mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
        - MYSQL_DATABASE=wordpress
        - MYSQL_USER=$SERVICE_USER_WORDPRESS
        - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    wordpress-files: {}
    mariadb-data: {}
