# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Wireguard Easy"
description: "The easiest way to run WireGuard VPN + Web-based Admin UI."
icon: shield
logo: "wireguard-easy.svg"
category: security
tags: ["wireguard", "vpn", "web", "admin"]
docs: "https://github.com/wg-easy/wg-easy"
notes: "Publica portas direto no servidor (`ports:`); confira conflitos com outros recursos."
main: "wg-easy"
port: 8000
env:
  SERVICE_FQDN_WIREGUARDEASY: "localhost"
  SERVICE_PASSWORD_ADMIN: "$generate:password"
compose: |
  services:
    wg-easy:
      image: ghcr.io/wg-easy/wg-easy:latest
      environment:
        - WG_HOST=${SERVICE_FQDN_WIREGUARDEASY}
        - LANG=${LANG:-en}
        - WG_PORT=51820
        - _PASSWORD=${SERVICE_PASSWORD_ADMIN}
      volumes:
        - wg-easy:/etc/wireguard
      ports:
        - 51820:51820/udp
      cap_add:
        - NET_ADMIN
        - SYS_MODULE
      sysctls:
        - net.ipv4.conf.all.src_valid_mark=1
        - net.ipv4.ip_forward=1
      entrypoint:
        - /bin/bash
        - -c
        - |
          eval "wgpw '${SERVICE_PASSWORD_ADMIN}' > /pass-hash"
          eval "$(cat /pass-hash) dumb-init node server.js"

  volumes:
    wg-easy: {}
