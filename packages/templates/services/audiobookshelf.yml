# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Audiobookshelf"
description: "Self-hosted audiobook, ebook, and podcast server"
icon: movie
logo: "audiobookshelf.svg"
category: media
tags: ["audiobooks", "ebooks", "podcasts", "server", "self-hosted"]
docs: "https://www.audiobookshelf.org/"
main: "audiobookshelf"
port: 80
env: {}
compose: |
  services:
    audiobookshelf:
      image: ghcr.io/advplyr/audiobookshelf:2.34.0
      environment:
        - TZ=${TIMEZONE:-America/Toronto}
      volumes:
        - audiobookshelf-audiobooks:/audiobooks
        - audiobookshelf-podcasts:/podcasts
        - audiobookshelf-config:/config
        - audiobookshelf-metadata:/metadata
      healthcheck:
        test: ["CMD-SHELL", "wget --quiet --tries=1 --timeout=5 http://localhost:80/ping -O /dev/null || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s
