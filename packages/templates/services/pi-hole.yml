# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "PI Hole"
description: "Network-wide Ad Blocking"
icon: terminal
logo: "pi-hole.svg"
category: devops
tags: ["ad-block", "dns", "sinkhole", "ntp", "dhcp"]
docs: "https://pi-hole.net/"
notes: "Publica portas direto no servidor (`ports:`); confira conflitos com outros recursos."
main: "pihole"
port: 80
env:
  SERVICE_PASSWORD_PIHOLE: "$generate:password"
compose: |
  services:
    pihole:
      image: pihole/pihole:latest
      ports:
        # DNS Ports
        - "53:53/tcp"
        - "53:53/udp"
        # Uncomment the below if using Pi-hole as your DHCP Server
        - "67:67/udp"
        # Uncomment the line below if you are using Pi-hole as your NTP server
        - "123:123/udp"
      environment:
        - TZ=${TZ:-Europe/London}
        - FTLCONF_webserver_api_password=${SERVICE_PASSWORD_PIHOLE}
        - FTLCONF_dns_listeningMode=${FTLCONF_dns_listeningMode:-all}
      volumes:
        - pihole-data:/etc/pihole
      cap_add:
        # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
        # Required if you are using Pi-hole as your DHCP server, else not needed
        - NET_ADMIN
        # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
        - SYS_TIME

  volumes:
    pihole-data: {}
