# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Linkding"
description: "A self-hosted bookmark manager designed to be minimal, fast, and easy to set up."
icon: movie
logo: "linkding.svg"
category: media
tags: ["rss", "feed"]
docs: "https://linkding.link/"
main: "linkding"
port: 9090
env:
  SERVICE_USER_LINKDING: "$generate:user"
  SERVICE_PASSWORD_LINKDING: "$generate:password"
compose: |
  services:
    linkding:
      image: sissbruecker/linkding:latest
      volumes:
        - 'linkding_data:/etc/linkding/data'
      environment:
        - LD_SUPERUSER_NAME=${SERVICE_USER_LINKDING}
        - LD_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_LINKDING}
      healthcheck:
        test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9090' || exit 1"]
        interval: 5s
        timeout: 5s

  volumes:
    linkding_data: {}
