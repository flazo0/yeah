# Imported from the Coolify service template catalog (Apache-2.0) by scripts/import-coolify-templates.ts — see NOTICE.
name: "Windows"
description: "Run Windows in a containerized environment."
icon: task_alt
logo: "windows.svg"
category: productivity
tags: ["windows", "virtualization", "container", "os"]
docs: "https://github.com/dockur/windows"
main: "windows"
port: 8006
env: {}
compose: |
  services:
    windows:
      image: dockurr/windows
      volumes:
        - windows-storage:/storage
      environment:
        - VERSION=11
      devices:
        - /dev/kvm:/dev/kvm
      cap_add:
        - NET_ADMIN
      stop_grace_period: 2m
      healthcheck:
        test: ["CMD", "nc", "-z", "127.0.0.1", "8006"]
        interval: 2s
        timeout: 10s
        retries: 10

  volumes:
    windows-storage: {}
