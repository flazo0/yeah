# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Bugsink"
description: "Self-hosted Error Tracking."
icon: monitor_heart
logo: "bugsink.svg"
category: monitoring
tags: ["python", "error-tracking", "django", "mysql"]
docs: "https://www.bugsink.com/docs/"
main: "mysql"
port: 8000
env:
  SERVICE_PASSWORD_ROOT: "$generate:password"
  SERVICE_USER_BUGSINK: "$generate:user"
  SERVICE_PASSWORD_BUGSINK: "$generate:password"
  SERVICE_PASSWORD_64_BUGSINK: "$generate:hex"
  SERVICE_URL_BUGSINK: "http://localhost"
compose: |
  services:
    mysql:
      image: 'mysql:latest'
      restart: unless-stopped
      environment:
        - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-bugsink}
        - MYSQL_USER=${SERVICE_USER_BUGSINK}
        - MYSQL_PASSWORD=${SERVICE_PASSWORD_BUGSINK}
      volumes:
        - my-datavolume:/var/lib/mysql
      healthcheck:
        test:
          - CMD
          - mysqladmin
          - ping
          - '-h'
          - 127.0.0.1
        interval: 5s
        timeout: 20s
        retries: 10
    web:
      image: bugsink/bugsink
      restart: unless-stopped
      environment:
        - SECRET_KEY=$SERVICE_PASSWORD_64_BUGSINK
        - CREATE_SUPERUSER=admin:$SERVICE_PASSWORD_BUGSINK
        - BASE_URL=$SERVICE_URL_BUGSINK
        - DATABASE_URL=mysql://${SERVICE_USER_BUGSINK}:$SERVICE_PASSWORD_BUGSINK@mysql:3306/${MYSQL_DATABASE:-bugsink}
        - BEHIND_HTTPS_PROXY=True
      depends_on:
        mysql:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/\").raise_for_status()'"]
        interval: 5s
        timeout: 20s
        retries: 10

  volumes:
    my-datavolume: {}
