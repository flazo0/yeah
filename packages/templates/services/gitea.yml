# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "Gitea"
description: "Lightweight self-hosted Git (with PostgreSQL) — repositories, issues and pull requests."
icon: merge
category: devops
website: "https://about.gitea.com"
docs: "https://docs.gitea.com"
main: gitea
port: 3000
env:
  DB_PASSWORD: "$generate:password"
compose: |
  services:
    gitea:
      image: gitea/gitea:1
      restart: unless-stopped
      depends_on:
        - db
      environment:
        - GITEA__database__DB_TYPE=postgres
        - GITEA__database__HOST=db:5432
        - GITEA__database__NAME=gitea
        - GITEA__database__USER=gitea
        - GITEA__database__PASSWD=${DB_PASSWORD}
      volumes:
        - data:/data
    db:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=gitea
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=gitea
      volumes:
        - db:/var/lib/postgresql/data
  volumes:
    data: {}
    db: {}
