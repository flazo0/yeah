# Template de serviço do yeah. Campos: name, description, icon (Material Symbols), category, tags, main (serviço que recebe o domínio),
# port (porta desse serviço), env (valores iniciais; "$generate:password|hex|base64" gera um segredo novo a cada instância) e compose.
name: "Uptime Kuma"
description: "Monitoramento de uptime self-hosted, com alertas — tipo um Pingdom seu."
icon: monitor_heart
category: monitoring
website: "https://uptime.kuma.pet"
docs: "https://github.com/louislam/uptime-kuma/wiki"
main: kuma
port: 3001
env: {}
compose: |
  services:
    kuma:
      image: louislam/uptime-kuma:1
      restart: unless-stopped
      volumes:
        - data:/app/data
  volumes:
    data: {}
