# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Readeck"
description: "Simple web application that lets you save the precious readable content of web pages you like and want to keep forever."
icon: task_alt
logo: "readeck.svg"
category: productivity
tags: ["read-it-later", "pocket-alternative", "omnivore-alternative", "instapaper-alternative"]
docs: "https://readeck.org/en/docs/"
main: "readeck"
port: 8000
env: {}
compose: |
  services:
    readeck:
      image: codeberg.org/readeck/readeck:latest
      environment:
        - READECK_USE_X_FORWARDED=${READECK_USE_X_FORWARDED:-true}
      volumes:
        - readeck_data:/readeck
      healthcheck:
        test:
          - CMD
          - /bin/readeck
          - healthcheck
          - '-config'
          - config.toml
        interval: 30s
        timeout: 2s
        retries: 3

  volumes:
    readeck_data: {}
