# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Cockpit"
description: "Cockpit is a headless content platform that is lightweight, fast and ready for takeoff."
icon: language
logo: "cockpit.svg"
category: cms
tags: ["cockpit", "headless", "cms", "database", "nosql"]
docs: "https://getcockpit.com/documentation/"
main: "cockpit"
port: 80
env: {}
compose: |
  services:
    cockpit:
      image: cockpithq/cockpit:core-latest
      volumes:
        - cockpit-config:/var/www/html/config
        - cockpit-spaces:/var/www/html/.spaces
        - cockpit-storage:/var/www/html/storage
      healthcheck:
        test:
          ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/system/healthcheck"]
        interval: 5s
        timeout: 20s
        retries: 10
