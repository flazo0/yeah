# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Newt Pangolin"
description: "Pangolin tunnels your services to the internet so you can access anything from anywhere."
icon: terminal
logo: "newt-pangolin.png"
category: devops
tags: ["wireguard", "reverse-proxy", "zero-trust-network-access", "open source"]
docs: "https://docs.digpangolin.com/manage/sites/install-site"
main: "newt"
port: 80
env:
  NEWT_ID: ""
  NEWT_SECRET: ""
compose: |
  services:
    newt:
      image: fosrl/newt:latest
      environment:
        - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT:-https://pangolin.domain.tld}
        - NEWT_ID=${NEWT_ID:?}
        - NEWT_SECRET=${NEWT_SECRET:?}
      healthcheck:
        test: ["CMD", "newt", "--version"]
        interval: 5s
        timeout: 20s
        retries: 10
