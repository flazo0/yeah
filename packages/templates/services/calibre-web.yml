# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Calibre Web"
description: "Calibre-web is a web app providing a clean interface for browsing, reading and downloading eBooks."
icon: movie
logo: "calibre-web.svg"
category: media
tags: ["calibre", "calibre-web", "ebook", "library", "epub", "ereader", "kindle", "book"]
docs: "https://github.com/linuxserver/docker-calibre-web"
main: "calibre-web"
port: 8083
env: {}
compose: |
  services:
    calibre-web:
      image: lscr.io/linuxserver/calibre-web:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Etc/UTC}
        # optional & x86-64 only Adds the ability to perform ebook conversion
        - 'DOCKER_MODS=${DOCKER_MODS:-linuxserver/mods:universal-calibre}'
      volumes:
        - calibre_web_data:/config
        - calibre_library:/books
      healthcheck:
        test:
          - CMD
          - curl
          - '-f'
          - 'http://127.0.0.1:8083'
        interval: 5s
        timeout: 20s
        retries: 10
