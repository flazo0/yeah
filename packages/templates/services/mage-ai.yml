# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Mage AI"
description: "Build, run, and manage data pipelines for integrating and transforming data."
icon: bolt
logo: "mage-ai.svg"
category: automation
tags: ["data", "dbt", "etl", "pipelines"]
docs: "https://docs.mage.ai"
main: "mage-ai"
port: 6789
env: {}
compose: |
  services:
    mage-ai:
      image: 'mageai/mageai:0.9.78'
      command: 'mage start default_project'
      environment:
        - PROJECT_NAME=default_project
        - USER_CODE_PATH=/home/src/default_project
        - ENV=production
      volumes:
        - 'mageai_data:/home/src/'
      restart: unless-stopped
      healthcheck:
        test:
          - CMD
          - curl
          - '-s'
          - '-f'
          - '-o'
          - /dev/null
          - 'http://127.0.0.1:6789'
        interval: 30s
        timeout: 10s
        retries: 5

  volumes:
    mageai_data: {}
