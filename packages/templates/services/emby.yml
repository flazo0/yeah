# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Emby"
description: "A media server software that allows you to organize, stream, and access your multimedia content effortlessly."
icon: movie
logo: "emby.png"
category: media
tags: ["media", "server", "movies", "tv", "music"]
docs: "https://emby.media/support/articles/Home.html"
main: "emby"
port: 8096
env: {}
compose: |
  services:
    emby:
      image: lscr.io/linuxserver/emby:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Madrid
      volumes:
        - emby-config:/config
        - emby-tvshows:/tvshows
        - emby-movies:/movies
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:8096"]
        interval: 2s
        timeout: 10s
        retries: 15
