# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Actualbudget"
description: "A local-first personal finance app."
icon: payments
logo: "actualbudget.png"
category: finance
tags: ["budgeting", "actual", "finance", "budget", "money", "expenses", "income"]
docs: "https://actualbudget.org/docs/install/docker"
main: "actual_server"
port: 5006
env: {}
compose: |
  services:
    actual_server:
      image: actualbudget/actual-server:latest
      environment:
        - ACTUAL_LOGIN_METHOD=password
      volumes:
        - actual_data:/data
      healthcheck:
        test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/5006' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3

  volumes:
    actual_data: {}
