# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Mealie"
description: "A recipe manager and meal planner."
icon: task_alt
logo: "mealie.png"
category: productivity
tags: ["recipe manager", "meal planner", "cooking", "food"]
docs: "https://docs.mealie.io/"
main: "mealie"
port: 9000
env: {}
compose: |
  services:
    mealie:
      image: 'ghcr.io/mealie-recipes/mealie:3.17.0'
      environment:
        - ALLOW_SIGNUP=${ALLOW_SIGNUP:-true}
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
        - TZ=${TZ:-Europe/Berlin}
        - MAX_WORKERS=${MAX_WORKERS:-1}
        - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      volumes:
        - mealie_data:/app/data
      healthcheck:
        test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
        interval: 5s
        timeout: 10s
        retries: 5
