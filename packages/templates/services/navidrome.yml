# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Navidrome"
description: "Standalone server, that allows you to browse and listen to your music collection using a web browser or any Subsonic-compatible client."
icon: movie
logo: "navidrome.svg"
category: media
tags: ["media", "server", "music", "subsonic"]
docs: "https://www.navidrome.org/docs/"
main: "navidrome"
port: 4533
env:
  SERVICE_URL_NAVIDROME: "http://localhost"
compose: |
  services:
    navidrome:
      image: deluan/navidrome:latest
      restart: unless-stopped
      environment:
        - ND_BASEURL=${SERVICE_URL_NAVIDROME}
        - ND_SCANSCHEDULE=${ND_SCANSCHEDULE:-1h}
        - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
        - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
        - ND_ENABLEINSIGHTSCOLLECTOR=${ND_ENABLEINSIGHTSCOLLECTOR:-false}
      volumes:
        - "./data:/data"
        - "./music:/music:ro"
      healthcheck:
        test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4533/ping"]
        interval: 10s
        timeout: 5s
        retries: 5
