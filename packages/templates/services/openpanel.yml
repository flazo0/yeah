# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Openpanel"
description: "Open source alternative to Mixpanel and Plausible for product analytics"
icon: analytics
logo: "openpanel.svg"
category: analytics
tags: ["analytics", "insights", "privacy", "mixpanel", "plausible", "google", "alternative"]
docs: "https://openpanel.dev/docs"
notes: "Este template traz arquivos de configuração próprios; eles foram convertidos do formato do Coolify e ainda não foram validados numa instalação real."
main: "openpanel-dashboard"
port: 3000
env:
  SERVICE_URL_OPAPI: "http://localhost"
  SERVICE_URL_OPDASHBOARD: "http://localhost"
  SERVICE_USER_POSTGRES: "$generate:user"
  SERVICE_PASSWORD_POSTGRES: "$generate:password"
  SERVICE_PASSWORD_REDIS: "$generate:password"
  SERVICE_BASE64_COOKIESECRET: "$generate:base64"
  OPENPANEL_EMAIL_SENDER: ""
  RESEND_API_KEY: ""
files:
  "clickhouse-config.xml": "<clickhouse>\n    <logger>\n        <level>warning</level>\n        <console>true</console>\n    </logger>\n    <keep_alive_timeout>10</keep_alive_timeout>\n    <!-- Stop all the unnecessary logging -->\n    <query_thread_log remove=\"remove\"/>\n    <query_log remove=\"remove\"/>\n    <text_log remove=\"remove\"/>\n    <trace_log remove=\"remove\"/>\n    <metric_log remove=\"remove\"/>\n    <asynchronous_metric_log remove=\"remove\"/>\n    <session_log remove=\"remove\"/>\n    <part_log remove=\"remove\"/>\n    <listen_host>0.0.0.0</listen_host>\n    <interserver_listen_host>0.0.0.0</interserver_listen_host>\n    <interserver_http_host>opch</interserver_http_host>\n    <!-- Disable cgroup memory observer -->\n    <cgroups_memory_usage_observer_wait_time>0</cgroups_memory_usage_observer_wait_time>\n    <!-- Not used anymore, but kept for backwards compatibility -->\n    <macros>\n        <shard>1</shard>\n        <replica>replica1</replica>\n        <cluster>openpanel_cluster</cluster>\n    </macros>\n</clickhouse>\n"
  "clickhouse-user-config.xml": "<clickhouse>\n    <profiles>\n        <default>\n            <log_queries>0</log_queries>\n            <log_query_threads>0</log_query_threads>\n        </default>\n    </profiles>\n</clickhouse>\n"
  "init-db.sh": "#!/bin/sh\nset -e\n\nclickhouse client -n <<-EOSQL\n  CREATE DATABASE IF NOT EXISTS openpanel;\nEOSQL\n"
compose: |
  services:
    openpanel-dashboard:
      image: lindesvard/openpanel-dashboard:2
      environment:
        - NODE_ENV=production
        - SELF_HOSTED=true
        - API_URL=${SERVICE_URL_OPAPI}
        - DASHBOARD_URL=${SERVICE_URL_OPDASHBOARD}
        - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
        - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
      depends_on:
        openpanel-api:
          condition: service_healthy
        openpanel-worker:
          condition: service_healthy
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        clickhouse:
          condition: service_healthy
      healthcheck:
        test:
          ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 15s

    openpanel-api:
      image: lindesvard/openpanel-api:2
      command: >
        sh -c "
          echo 'Running migrations...'
          CI=true pnpm -r run migrate:deploy

          pnpm start
        "
      environment:
        - NODE_ENV=production
        - SELF_HOSTED=true
        - API_URL=${SERVICE_URL_OPAPI}
        - DASHBOARD_URL=${SERVICE_URL_OPDASHBOARD}
        - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - DATABASE_URL_DIRECT=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
        - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
        - COOKIE_SECRET=${SERVICE_BASE64_COOKIESECRET}
        - ALLOW_REGISTRATION=${OPENPANEL_ALLOW_REGISTRATION:-false}
        - ALLOW_INVITATION=${OPENPANEL_ALLOW_INVITATION:-false}
        - EMAIL_SENDER=${OPENPANEL_EMAIL_SENDER}
        - RESEND_API_KEY=${RESEND_API_KEY}
      depends_on:
        postgres:
          condition: service_healthy
        clickhouse:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5

    openpanel-worker:
      image: lindesvard/openpanel-worker:2
      environment:
        - DISABLE_BULLBOARD=${DISABLE_BULLBOARD:-1}
        - NODE_ENV=production
        - SELF_HOSTED=true
        - API_URL=${SERVICE_URL_OPAPI}
        - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - DATABASE_URL_DIRECT=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
        - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
      depends_on:
        openpanel-api:
          condition: service_healthy
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        clickhouse:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 5s

    postgres:
      image: postgres:16-alpine
      volumes:
        - openpanel_postgres_data:/var/lib/postgresql/data
      environment:
        - POSTGRES_DB=${OPENPANEL_POSTGRES_DB:-openpanel-db}
        - POSTGRES_USER=${SERVICE_USER_POSTGRES}
        - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5

    redis:
      image: redis:7.4-alpine
      volumes:
        - openpanel_redis_data:/data
      environment:
        - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS} --maxmemory-policy noeviction
      healthcheck:
        test: [CMD, redis-cli, -a, "${SERVICE_PASSWORD_REDIS}", ping]
        interval: 10s
        timeout: 5s
        retries: 5

    clickhouse:
      image: clickhouse/clickhouse-server:25.10.2.65
      environment:
        - CLICKHOUSE_SKIP_USER_SETUP=1
      volumes:
        - openpanel_clickhouse_data:/var/lib/clickhouse
        - openpanel_clickhouse_logs:/var/log/clickhouse-server
        - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml:ro
        - ./clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml:ro
        - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      healthcheck:
        test: [CMD-SHELL, 'clickhouse-client --query "SELECT 1"']
        interval: 10s
        timeout: 5s
        retries: 5

  volumes:
    openpanel_postgres_data: {}
    openpanel_redis_data: {}
    openpanel_clickhouse_data: {}
    openpanel_clickhouse_logs: {}
