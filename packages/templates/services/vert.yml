name: "Vert"
description: "The next-generation file converter. Open source, fully local and free forever."
icon: code
logo: "vert.png"
category: dev
tags: ["converter", "file", "documents", "files", "ffmpeg", "wasm"]
docs: "https://github.com/VERT-sh/VERT"
main: "vert"
port: 80
env:
  SERVICE_URL_VERT_80: "http://localhost"
compose: |
  services:
    vert:
      image: ghcr.io/vert-sh/vert:latest
      environment:
        - PUB_VERT_URL=${SERVICE_URL_VERT_80}
