name: "Neon WS Proxy"
description: "The database you love, on a serverless platform designed to help you build reliable and scalable applications faster."
icon: terminal
logo: "neon-ws-proxy.svg"
category: devops
tags: ["proxy", "neon", "postgresql"]
docs: "https://neon.tech"
main: "neon-proxy"
port: 80
env:
  SERVICE_USER_POSTGRESQL: "$generate:user"
  SERVICE_PASSWORD_POSTGRESQL: "$generate:password"
compose: |
  services:
    neon-proxy:
      image: 'ghcr.io/neondatabase/wsproxy:latest'
      environment:
        - 'APPEND_PORT=postgres:5432'
        - 'ALLOW_ADDR_REGEX=.*'
        - LOG_TRAFFIC=false
        - LOG_CONN_INFO=true
      restart: unless-stopped
      depends_on:
        - postgres
      healthcheck:
        test:
          - CMD-SHELL
          - 'nc -z 127.0.0.1 80'
        interval: 5s
        timeout: 2s
        retries: 20

    postgres:
      image: 'postgres:17-alpine'
      volumes:
        - 'postgresql-data:/var/lib/postgresql/data'
      environment:
        - 'POSTGRES_USER=${SERVICE_USER_POSTGRESQL}'
        - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}'
        - 'POSTGRES_DB=${POSTGRESQL_DATABASE:-postgres}'
        - 'POSTGRES_HOST_AUTH_METHOD=password'
      healthcheck:
        test:
          - CMD-SHELL
          - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
        interval: 5s
        timeout: 20s
        retries: 10
