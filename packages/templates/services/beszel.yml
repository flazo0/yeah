# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Beszel"
description: "A lightweight server resource monitoring hub with historical data, docker stats, and alerts."
icon: monitor_heart
logo: "beszel.svg"
category: monitoring
tags: ["beszel", "monitoring", "server", "stats", "alerts"]
docs: "https://github.com/henrygd/beszel?tab=readme-ov-file#getting-started"
notes: "Usa `network_mode: host`: o container compartilha a rede do servidor."
main: "beszel"
port: 8090
env:
  SERVICE_URL_BESZEL: "http://localhost"
  TOKEN: ""
  KEY: ""
  SYSTEM_NAME: ""
compose: |
  services:
    beszel:
      image: 'henrygd/beszel:0.18.7' # Released on 6 April 2026
      environment:
        - CONTAINER_DETAILS=${CONTAINER_DETAILS:-true}
        - SHARE_ALL_SYSTEMS=${SHARE_ALL_SYSTEMS:-false}
      volumes:
        - 'beszel_data:/beszel_data'
        - 'beszel_socket:/beszel_socket'
      healthcheck:
        test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
        interval: 30s
        timeout: 20s
        retries: 10
        start_period: 5s
    beszel-agent:
      image: 'henrygd/beszel-agent:0.18.7' # Released on 6 April 2026
      network_mode: host # Network stats graphs won't work if agent cannot access host system network stack
      environment:
        # Required
        - LISTEN=/beszel_socket/beszel.sock
        - HUB_URL=$SERVICE_URL_BESZEL
        - TOKEN=${TOKEN}            # From hub token settings
        - KEY=${KEY}                # SSH public key(s) from hub
        # Optional
        - DISABLE_SSH=${DISABLE_SSH:-false}        # Disable SSH
        - LOG_LEVEL=${LOG_LEVEL:-warn}              # Logging level
        - SKIP_GPU=${SKIP_GPU:-false}               # Skip GPU monitoring
        - SYSTEM_NAME=${SYSTEM_NAME}                # Custom system name
      volumes:
        - beszel_agent_data:/var/lib/beszel-agent
        - beszel_socket:/beszel_socket
        - '/var/run/docker.sock:/var/run/docker.sock:ro'
      healthcheck:
        test: ['CMD', '/agent', 'health']
        interval: 60s
        timeout: 20s
        retries: 10
        start_period: 5s
