# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Heyform"
description: "Allows anyone to create engaging conversational forms for surveys, questionnaires, quizzes, and polls. No coding skills required."
icon: task_alt
logo: "heyform.svg"
category: productivity
tags: ["form", "builder", "forms", "survey", "quiz", "open source", "self-hosted", "docker"]
docs: "https://docs.heyform.net/open-source/self-hosting"
main: "heyform"
port: 9157
env:
  SERVICE_URL_HEYFORM: "http://localhost"
  SERVICE_BASE64_64_SESSION: "$generate:base64long"
  SERVICE_BASE64_64_FORM: "$generate:base64long"
  SERVICE_PASSWORD_KEYDB: "$generate:password"
compose: |
  services:
    heyform:
      image: heyform/community-edition:latest
      volumes:
        - heyform-assets:/app/static/upload
      depends_on:
        mongo:
          condition: service_healthy
        keydb:
          condition: service_healthy
      environment:
        - APP_HOMEPAGE_URL=${SERVICE_URL_HEYFORM}
        - SESSION_KEY=${SERVICE_BASE64_64_SESSION}
        - FORM_ENCRYPTION_KEY=${SERVICE_BASE64_64_FORM}
        - MONGO_URI=mongodb://mongo:27017/heyform
        - REDIS_HOST=keydb
        - REDIS_PORT=6379
        - REDIS_PASSWORD=${SERVICE_PASSWORD_KEYDB}
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9157 || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 3

    mongo:
      image: percona/percona-server-mongodb:latest
      volumes:
        - heyform-mongo-data:/data/db
      healthcheck:
        test: ["CMD-SHELL", "echo 'ok' > /dev/null 2>&1"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 5s

    keydb:
      image: eqalpha/keydb:latest
      command: keydb-server --appendonly yes
      environment:
        - KEYDB_PASSWORD=${SERVICE_PASSWORD_KEYDB}
      volumes:
        - heyform-keydb-data:/data
      healthcheck:
        test: ["CMD-SHELL", "keydb-cli", "--pass", "${SERVICE_PASSWORD_KEYDB}", "ping"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 5s

  volumes:
    heyform-assets: {}
    heyform-mongo-data: {}
    heyform-keydb-data: {}
