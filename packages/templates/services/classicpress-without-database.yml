# Imported from the Coolify service template catalog (Apache-2.0) by scripts/import-coolify-templates.ts — see NOTICE.
name: "Classicpress Without Database"
description: "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
icon: language
logo: "classicpress-without-database.svg"
category: cms
tags: ["cms", "blog", "content", "management"]
docs: "https://www.classicpress.net/"
main: "classicpress"
port: 80
env: {}
compose: |
  services:
     classicpress:
      image: classicpress/classicpress:latest
      volumes:
         - classicpress-files:/var/www/html
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1"]
        interval: 2s
        timeout: 10s
        retries: 10

  volumes:
    classicpress-files: {}
