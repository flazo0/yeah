# yeah service template. Fields: name, description, icon (Material Symbols), category, tags, main (the service that receives the domain),
# port (that service's port), env (initial values; "$generate:password|hex|base64" generates a new secret per instance) and compose.
name: "PocketBase"
description: "Backend in a single file: database, auth, storage and a real-time API."
icon: storage
category: database
website: "https://pocketbase.io"
main: pocketbase
port: 8090
env: {}
compose: |
  services:
    pocketbase:
      image: ghcr.io/muchobien/pocketbase:latest
      restart: unless-stopped
      volumes:
        - data:/pb_data
  volumes:
    data: {}
