# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Typesense"
description: "Cutting-edge, in-memory search engine for mere mortals. Knowledge of rocket science optional."
icon: search
logo: "typesense.png"
category: search
tags: ["search", "search-engine", "search-api", "elasticsearch-alternative"]
docs: "https://typesense.org/docs"
main: "typesense"
port: 8108
env:
  TYPESENSE_API_KEY: ""
compose: |
  services:
    typesense:
      image: typesense/typesense:28.0
      environment:
        - TYPESENSE_ENABLE_CORS=${TYPESENSE_ENABLE_CORS:-true}
        - TYPESENSE_DATA_DIR=/data
        - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:?}
      volumes:
        - typesense_data:/data
      healthcheck:
        test:
          [
            CMD,
            bash,
            -c,
            "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep '200' && exec 3>&-",
          ]
        retries: 5
        timeout: 7s

  volumes:
    typesense_data: {}
