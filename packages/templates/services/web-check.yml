# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Web Check"
description: "All-in-one OSINT tool for analysing any website"
icon: monitor_heart
logo: "web-check.png"
category: monitoring
tags: ["osint", "website", "analysis"]
docs: "https://github.com/lissy93/web-check"
main: "web-check"
port: 3000
env: {}
compose: |
  services:
    web-check:
      image: lissy93/web-check
      environment:
      healthcheck:
        test:
          - CMD-SHELL
          - 'wget -qO- http://127.0.0.1:3000/'
        interval: 5s
        timeout: 20s
        retries: 10
