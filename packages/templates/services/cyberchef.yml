# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Cyberchef"
description: "The Cyber Swiss Army Knife - a web app for encryption, encoding, compression and data analysis"
icon: shield
logo: "cyberchef.jpeg"
category: security
tags: ["encryption", "encoding", "compression", "data analysis", "tools", "development"]
docs: "https://github.com/gchq/CyberChef"
main: "cyberchef"
port: 80
env: {}
compose: |
  services:
    cyberchef:
      image: ghcr.io/gchq/cyberchef:latest
      platform: linux/amd64
      environment:
      volumes:
        - cyberchef-data:/app/data
      healthcheck:
        test:
          - CMD
          - curl
          - '-f'
          - 'http://127.0.0.1:80'
        interval: 30s
        timeout: 10s
        retries: 3
