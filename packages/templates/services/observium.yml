name: "Observium"
description: "Observium is a comprehensive network monitoring platform designed to deliver powerful monitoring capabilities, combined with an elegant and intuitive user interface."
icon: monitor_heart
logo: "observium.webp"
category: monitoring
tags: ["networking", "monitoring"]
docs: "https://docs.observium.org/"
main: "observium"
port: 80
env:
  SERVICE_PASSWORD_OBSERVIUMADMIN: "$generate:password"
  SERVICE_USER_OBSERVIUMADMIN: "$generate:user"
  SERVICE_PASSWORD_MARIADB: "$generate:password"
  SERVICE_USER_MARIADB: "$generate:user"
  SERVICE_PASSWORD_MARIADBROOT: "$generate:password"
compose: |
  services:
    observium:
      image: mbixtech/observium:latest
      platform: linux/amd64
      volumes:
        - observium_logs:/opt/observium/logs
        - observium_rrd:/opt/observium/rrd
      environment:
        - OBSERVIUM_ADMIN_PASS=${SERVICE_PASSWORD_OBSERVIUMADMIN}
        - OBSERVIUM_ADMIN_USER=${SERVICE_USER_OBSERVIUMADMIN}
        - OBSERVIUM_DB_HOST=mariadb
        - OBSERVIUM_DB_NAME=${OBSERVIUM_DB_NAME:-observium-db}
        - OBSERVIUM_DB_PASS=${SERVICE_PASSWORD_MARIADB}
        - OBSERVIUM_DB_USER=${SERVICE_USER_MARIADB}
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        test:
          - CMD
          - curl
          - "-f"
          - "http://localhost/"
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 5s

    mariadb:
      image: mariadb:lts
      volumes:
        - observium_mariadb_data:/var/lib/mysql
      environment:
        - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_MARIADBROOT}
        - MARIADB_USER=${SERVICE_USER_MARIADB}
        - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
        - MARIADB_DATABASE=${MARIADB_DATABASE:-observium-db}
      healthcheck:
        test:
          - CMD
          - healthcheck.sh
          - "--connect"
          - "--innodb_initialized"
        start_period: 10s
        interval: 10s
        timeout: 5s
        retries: 3
