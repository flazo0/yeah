name: "Vault"
description: "HashiCorp Vault securely stores and controls access to secrets."
icon: shield
category: security
tags: ["vault", "hashicorp", "secrets", "security", "encryption"]
docs: "https://developer.hashicorp.com/vault/docs/deploy/run-container"
main: "vault"
port: 8200
env:
  SERVICE_URL_VAULT_8200: "http://localhost"
compose: |
  services:
    vault:
      image: 'hashicorp/vault:${VAULT_VERSION:-latest}'
      command: server
      environment:
        - VAULT_ADDR=http://127.0.0.1:8200
        - VAULT_API_ADDR=${SERVICE_URL_VAULT_8200}
        - 'VAULT_LOCAL_CONFIG={"ui":true,"disable_mlock":true,"storage":{"file":{"path":"/vault/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}}'
      volumes:
        - vault-data:/vault/file
      healthcheck:
        test:
          - CMD-SHELL
          - 'wget -qO- "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200" >/dev/null || exit 1'
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 15s

  volumes:
    vault-data: {}
