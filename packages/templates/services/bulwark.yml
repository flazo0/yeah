# Importado do catálogo de templates do Coolify (Apache-2.0) por scripts/import-coolify-templates.ts — ver NOTICE.
name: "Bulwark"
description: "Modern webmail platform"
icon: forum
category: messaging
tags: ["mail", "webmail", "jmap", "email", "messaging"]
docs: "https://bulwarkmail.org/docs"
main: "bulwark"
port: 3000
env:
  JMAP_SERVER_URL: ""
  SERVICE_HEX_64_BULWARK: ""
compose: |
  services:
    bulwark:
      image: 'ghcr.io/bulwarkmail/webmail:v1.8.1'
      environment:
        - JMAP_SERVER_URL=${JMAP_SERVER_URL:?}
        - SESSION_SECRET=${SERVICE_HEX_64_BULWARK}
      volumes:
        - 'bulwark-config:/app/data/admin'
        - 'bulwark-state:/app/data/admin-state'
      healthcheck:
        test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s

  volumes:
    bulwark-config: {}
    bulwark-state: {}
