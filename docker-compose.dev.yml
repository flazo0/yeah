services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yeah
      POSTGRES_PASSWORD: yeah
      POSTGRES_DB: yeah_dev
    ports:
      - "5432:5432"
    volumes:
      - yeah_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeah -d yeah_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - yeah_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yeah_dev_postgres_data:
  yeah_dev_redis_data:
