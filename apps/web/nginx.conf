# Lets /secret/api/ carry WebSockets (interactive terminals) without forcing "Connection: upgrade" on plain requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/realip.inc;

    location = /secret {
        return 301 /secret/;
    }

    location /secret/api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /secret/ws {
        proxy_pass http://ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /secret/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /secret/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /secret/index.html;
        index index.html;
    }

    location / {
        return 444;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
