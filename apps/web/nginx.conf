server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/realip.inc;

    # Reverse-proxies api/ws into the same origin as the dashboard, so only this one port needs
    # to be reachable from the internet — api/ws stay bound to 127.0.0.1 on the host (see
    # docker-compose.prod.yml) and are only reachable through here. This also means the frontend
    # never needs to know its own public host/IP at build time (see lib/api.ts, lib/ws.ts).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Vue Router uses history mode — any path that isn't a real static file falls back to
    # index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
