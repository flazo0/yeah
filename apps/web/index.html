<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yeah</title>
    <meta name="description" content="Plataforma self-hosted para deploy de apps, bancos e serviços — sem depender de nuvem de terceiros." />

    <!-- Nunca indexar / rastrear: instância self-hosted, não é um produto público de vitrine. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <!--
      Sem CDNs ou serviços de terceiros: tudo (fontes, ícones, imagens) é servido pela própria instância.
      connect-src só permite a api/ws desta instância — em produção %VITE_API_URL%/%VITE_WS_URL%
      ficam vazios (api/ws são same-origin via /api e /ws, reverse-proxied pelo nginx — ver
      apps/web/nginx.conf), então 'self' sozinho já cobre; só viram um host explícito se alguém
      optar por rodar api/ws fora do proxy compartilhado. A api em ws:// também entra em connect-src (os terminais interativos abrem um WebSocket direto nela).
      Nunca um domínio do Google ou qualquer
      outro terceiro. Em produção, reforçar via header no proxy além deste meta tag.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' %VITE_API_URL% %VITE_WS_URL% __API_WS_URL__;" />

    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/GoogleSansCode-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <!-- material-symbols-outlined is used on nearly every page (sidebar, buttons, badges) from the
         very first paint, so it's worth the same treatment — the browser only discovers a @font-face
         needs fetching once CSS is parsed AND a matching element is about to lay out; preloading
         starts the fetch immediately instead, in parallel with everything else. -->
    <link rel="preload" href="/fonts/MaterialSymbolsOutlined.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph / previews de compartilhamento (auto-hospedado, sem chamar serviço externo) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="yeah" />
    <meta property="og:title" content="yeah" />
    <meta property="og:description" content="Plataforma self-hosted para deploy de apps, bancos e serviços — sem depender de nuvem de terceiros." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="675" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="yeah" />
    <meta name="twitter:description" content="Plataforma self-hosted para deploy de apps, bancos e serviços." />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
