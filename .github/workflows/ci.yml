name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Dockerfile (newer 1.4.x releases break vue-tsc .vue resolution).
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (backend and packages)
        run: bun run --filter '!@yeah/web' typecheck

      - name: Typecheck (dashboard, run with Node)
        run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
        working-directory: apps/web

      - name: Unit tests
        run: bun test
