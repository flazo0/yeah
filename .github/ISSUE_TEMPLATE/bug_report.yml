name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not report security vulnerabilities here** — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash shown on the Updates page, or `git rev-parse HEAD`.
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and Docker version of the panel host and of the managed server; browser if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output (`sudo yeah logs api`, deploy log, browser console). Remove secrets first.
      render: shell
